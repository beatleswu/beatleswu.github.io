<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>啟蒙班 20 課｜課程候選預覽</title>
<link rel="stylesheet" href="course.css">
<main id="g066-course">
 <div class="eyebrow">GO ODYSSEY · 啟蒙班 V1</div>
 <h1>從第一口氣，走向第一盤棋</h1>
 <p>四週・20 課・每課 8 題練習</p>
 <aside>候選預覽，尚未正式開放。課程、媒體與規則仍待 Owner 驗收。</aside>

 <p id="moves" aria-live="polite"></p><button id="clear">重選落點</button><button id="submit">送出答案</button>
 <button id="retry" hidden>重試錯題</button><button id="replace" hidden>換一道備用題</button><button id="next" hidden>下一題</button>
