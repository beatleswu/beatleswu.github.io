<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F026 Battlefield Boss Mapping A presentation fixture</title>
  <link rel="stylesheet" href="/css/e10/battlefield_boss_reward_presentation_v1.css">
  <style>
    :root { color-scheme: light; font-family: 'DM Sans', system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #173d43; color: #f1e4c1; }
    main { width: min(760px, calc(100vw - 28px)); margin: 0 auto; padding: 28px 0; }
    .fixture-header { margin-bottom: 18px; }
    .fixture-header p { margin: 5px 0 0; color: rgba(241,228,193,.72); line-height: 1.5; }
    .fixture-kicker { font: 700 10px/1.2 'DM Mono', monospace; letter-spacing: .14em; }
    .fixture-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    button { border: 1px solid #d6aa51; border-radius: 999px; padding: 9px 12px; color: #173d43; background: #f1e4c1; font-weight: 700; cursor: pointer; }
    button[aria-pressed="true"] { color: #fff1c7; background: #0d6f69; }
    #battlefield-boss-reward-result { min-height: 10px; }
    @media (max-width: 700px) { main { padding-top: 18px; } .fixture-controls { gap: 6px; } button { flex: 1 1 145px; } }
  </style>
</head>
<body>
  <main>
    <header class="fixture-header">
      <div class="fixture-kicker">F026 · MAPPING A COVERAGE FIXTURE</div>
      <h1>Battlefield Boss cosmetics</h1>
      <p>These are synthetic server-authored F024 transport payloads. Mapping A remains owned by F022; this fixture checks presentation coverage only.</p>
    </header>
    <nav id="f026-controls" class="fixture-controls" aria-label="Mapping A presentation states"></nav>
    <section id="battlefield-boss-reward-result" data-presentation-only="true" aria-label="Battlefield Boss reward result"></section>
  </main>
  <script src="/js/game/battlefield_boss_cosmetic_display_v1.js"></script>
  <script src="/js/game/battlefield_boss_reward_presentation_v1.js"></script>
  <script>
    (function () {
      'use strict';
      var base = {
        contract_version: 'F024_BATTLEFIELD_BOSS_REWARD_RESULT_TRANSPORT_V1',
        reward_policy_version: 'F022_BATTLEFIELD_BOSS_MAPPING_A_V1',
      };
      // Test-only coverage data. The presentation consumes mapped_cosmetic_id;
      // this list does not execute or redefine the server-owned Mapping A.
      var coverage = [
        ['zone-01', 'zone_01', 'back_pack'],
        ['zone-02', 'zone_02', 'hat_cloth'],
        ['zone-03', 'zone_03', 'hat_bamboo'],
        ['zone-04', 'zone_04', 'robe_crane'],
        ['zone-05', 'zone_05', 'hat_onihorns'],
        ['zone-06', 'zone_06', 'robe_dragon'],
        ['zone-07', 'zone_07', 'acc_dragon_pendant'],
        ['zone-08', 'zone_08', 'back_cloak'],
        ['zone-09', 'zone_09', 'hat_dragon_horn'],
        ['zone-10', 'zone_10', 'hat_celestial_crown'],
      ];
      var payloads = {};
      var controls = document.getElementById('f026-controls');
      coverage.forEach(function (entry) {
        var name = entry[0];
        payloads[name] = Object.assign({}, base, {
          status: 'FIRST_CLEAR_NEW_COSMETIC',
          zone_key: entry[1],
          mapped_cosmetic_id: entry[2],
          first_clear_entitlement_consumed: true,
          cosmetic_newly_owned: true,
          already_owned_no_op: false,
          entitlement_replayed: false,
        });
        var button = document.createElement('button');
        button.type = 'button';
        button.dataset.case = name;
        button.textContent = name.replace('-', ' ').replace('zone', 'Zone');
        button.setAttribute('aria-pressed', 'false');
        controls.appendChild(button);
      });
      payloads.owned = Object.assign({}, payloads['zone-04'], {
        status: 'FIRST_CLEAR_ALREADY_OWNED_NO_OP',
        cosmetic_newly_owned: false,
        already_owned_no_op: true,
      });
      payloads['not-first'] = Object.assign({}, payloads['zone-10'], {
        status: 'NOT_FIRST_CLEAR',
        first_clear_entitlement_consumed: false,
        cosmetic_newly_owned: false,
        already_owned_no_op: false,
        entitlement_replayed: true,
      });
      ['owned', 'not-first'].forEach(function (name) {
        var button = document.createElement('button');
        button.type = 'button';
        button.dataset.case = name;
        button.textContent = name === 'owned' ? 'Already owned' : 'Not first clear';
        button.setAttribute('aria-pressed', 'false');
        controls.appendChild(button);
      });
      var target = document.getElementById('battlefield-boss-reward-result');
      function render(name) {
        var result = window.BattlefieldBossRewardPresentationV1.renderResult(target, payloads[name], { locale: 'en' });
        if (!result.ok) throw new Error('fixture render failed: ' + result.error);
        document.querySelectorAll('[data-case]').forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.dataset.case === name));
        });
        target.dataset.fixtureCase = name;
      }
      document.querySelectorAll('[data-case]').forEach(function (button) {
        button.addEventListener('click', function () { render(button.dataset.case); });
      });
      window.__F026_FIXTURE__ = { render: render, payloads: payloads, coverage: coverage, target: target };
      render('zone-01');
    }());
  </script>
</body>
</html>
