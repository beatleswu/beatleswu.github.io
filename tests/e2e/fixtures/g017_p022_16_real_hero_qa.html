<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>G017 P022 16 isolated hand prop QA — NOT ADMITTED</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #111827; color: #fff; }
  #stage { width: 640px; height: 720px; }
  canvas { display: block; }
</style>
<div id="stage"></div>
<script type="importmap">
{"imports":{"three":"/assets/3d_shop/p048/vendor/three.module.js"}}
</script>
<script type="module">
import * as THREE from "/assets/3d_shop/p048/vendor/three.module.js";
import { GLTFLoader } from "/assets/3d_shop/p048/vendor/jsm/loaders/GLTFLoader.js";
import { createG009SharedHeroAttachmentHost } from "/js/g009_shared_hero_attachment_host.js";

import { createHeroEquipmentAttachmentAdapter } from "/js/hero_equipment_attachment_adapter.js";

const stage = document.querySelector("#stage");
const QA = location.hostname==="127.0.0.1" && location.protocol==="http:"
  && new URLSearchParams(location.search).get("g017_qa")==="1";
if (!QA) throw new Error("G017_P022_QA_NOT_AUTHORIZED_FOR_THIS_ORIGIN");
const response=await fetch("/docs/handoffs/G017_P022_16_QA_SOURCE_AND_ATTACHMENT_20261021.json",
  {cache:"no-store"});
if(!response.ok)throw new Error("G017_P022_MANIFEST_MISSING");
const source=await response.json();
if(source.schema!=="G017_P022_16_SOURCED_QA_V1"
   ||source.release_status!=="NOT_ADMITTED"||source.total!==16
   ||source.nonprojectile_handheld!==13||source.projectile_props_only!==3)
 throw new Error("G017_MANIFEST_NOT_AUTHORIZED");
const rows=new Map();
for(const x of source.models){
 if(!/^G017_P022_[A-Z0-9-]+$/.test(x.qa_id)
   ||x.formal_product_release!=="NOT_ADMITTED"||x.equip_enabled!==false
   ||x.shop_enabled!==false||x.formal_item_id!==null
   ||x.legal_admission_proven!==false
   ||!["MAIN_HAND_STATIC_QA","PROJECTILE_PROP_ONLY"].includes(x.functional_class)
   ||x.attach_test_slot!=="MAIN_HAND"
   ||!/^tests\/e2e\/g011_private_qa_assets\/[A-Za-z0-9_]+_p022_qa\.glb$/.test(x.runtime_glb)
   ||!/^[0-9a-f]{64}$/.test(x.runtime_sha256)
   ||rows.has(x.qa_id))throw new Error("G017_SOURCE_GATE_FAILED");
 rows.set(x.qa_id,Object.freeze({asset_id:x.qa_id,presentation_id:x.qa_id,
  runtime_asset:"/"+x.runtime_glb,runtime_sha256:x.runtime_sha256,
  slot:"MAIN_HAND",test_only:true,functional_class:x.functional_class,
  official_equip_allowed:false}));
}
if(rows.size!==16)throw new Error("G017_COUNT_FAIL_CLOSED");
window.__g017P022QA={all:[...rows.values()],activeCount:16,
 projectileProps:3,formalRelease:false};
let root = null;
let host = null;
let adapter = null;
let scene = null;
let camera = null;
let renderer = null;
let animations = [];
let heroBounds = null;
let liveRenderers = 0;
let maxRenderers = 0;
let activeWeapon = null;
let currentCharacter = null;

function normalizedBoneName(node) {
  return node.isBone ? node.name.toLowerCase().replace(/[^a-z0-9]/g, "") : "";
}

function handBone(side) {
  const key = side === "R" ? "handr" : "handl";
  const found = [];
  root.traverse((node) => { if (normalizedBoneName(node) === key) found.push(node); });
  if (found.length !== 1) throw new Error(`real_${side}_hand_bone_count_${found.length}`);
  return found[0];
}

function poseBone(name) {
  const found = [];
  root.traverse((node) => { if (normalizedBoneName(node) === name) found.push(node); });
  if (found.length !== 1) throw new Error(`real_pose_bone_${name}_count_${found.length}`);
  return found[0];
}

function matrixDelta(left, right) {
  return Math.max(...left.elements.map((value, index) => Math.abs(value - right.elements[index])));
}

async function loadGlb(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) throw new Error(`glb_http_${response.status}:${path}`);
  const bytes = await response.arrayBuffer();
  return { bytes, gltf: await new GLTFLoader().parseAsync(bytes, new URL(path, location.href).href) };
}

function fitModel(model) {
  model.updateMatrixWorld(true);
  let bounds = new THREE.Box3().setFromObject(model);
  const size = bounds.getSize(new THREE.Vector3());
  const height = Math.max(size.x, size.y, size.z);
  if (!Number.isFinite(height) || height <= 0) throw new Error("real_hero_bounds_invalid");
  model.scale.multiplyScalar(4.1 / height);
  model.updateMatrixWorld(true);
  bounds = new THREE.Box3().setFromObject(model);
  const center = bounds.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.y -= bounds.min.y;
  model.position.z -= center.z;
  model.updateMatrixWorld(true);
  return new THREE.Box3().setFromObject(model);
}

function render() {
  root.updateMatrixWorld(true);
  renderer.render(scene, camera);
}

function closeHero() {
  if (adapter) adapter.dispose();
  if (host) host.destroy();
  if (renderer) {
    renderer.dispose();
    renderer.domElement.remove();
    liveRenderers -= 1;
  }
  root = host = adapter = scene = camera = renderer = activeWeapon = null;
  animations = [];
}

function appearanceContext() {
  return {
    character_key: currentCharacter,
    character_key_source: "player_appearance.character_key",
    character_key_authority: "player_appearance.character_key",
    character_entitled: true,
    character_runtime: { character_key: currentCharacter },
  };
}

window.startHero = async ({ characterKey, heroPath }) => {
  closeHero();
  currentCharacter = characterKey;
  const loaded = await loadGlb(heroPath);
  root = loaded.gltf.scene;
  animations = loaded.gltf.animations || [];
  const fitted = fitModel(root);
  handBone("R");
  handBone("L");
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111827);
  scene.add(new THREE.HemisphereLight(0xf1f7ff, 0x334155, 2.0));
  const key = new THREE.DirectionalLight(0xffefd5, 2.8);
  key.position.set(-3, 7, 8);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xa9d9ff, 1.1);
  fill.position.set(4, 3, -4);
  scene.add(fill);
  scene.add(root);
  const center = fitted.getCenter(new THREE.Vector3());
  camera = new THREE.PerspectiveCamera(34, 640 / 720, 0.01, 100);
  camera.position.set(center.x, center.y + 0.15, center.z + 8.4);
  camera.lookAt(center.x, center.y, center.z);
  renderer = new THREE.WebGLRenderer({ alpha: false, antialias: true, powerPreference: "high-performance" });
  liveRenderers += 1;
  maxRenderers = Math.max(maxRenderers, liveRenderers);
  renderer.setPixelRatio(1);
  renderer.setSize(640, 720, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  stage.replaceChildren(renderer.domElement);
  host = createG009SharedHeroAttachmentHost(root, THREE);
  host.registerResolver("MAIN_HAND", assetId=>rows.get(assetId)||null);
  adapter = createHeroEquipmentAttachmentAdapter({ getHeroSharedAttachmentHost: () => host }, {
    allowTestOnlyDescriptors: true,
    loadPresentation: async (descriptor) => {
      if (!rows.has(descriptor.asset_id)
          || descriptor.test_only!==true
          || descriptor.slot!==rows.get(descriptor.asset_id).slot)
        throw new Error("G013_UNKNOWN_QA_ATTACHMENT");
      const loaded=await loadGlb(descriptor.runtime_asset);
      const digest=await crypto.subtle.digest("SHA-256",loaded.bytes);
      const sha=Array.from(new Uint8Array(digest),
        n=>n.toString(16).padStart(2,"0")).join("");
      if(sha!==descriptor.runtime_sha256)
        throw new Error("G013_SHA_MISMATCH:"+descriptor.asset_id);
      const model=loaded.gltf.scene;
      const box=new THREE.Box3().setFromObject(model);
      if(box.isEmpty())throw new Error("G013_EMPTY_GEOMETRY");
      const dim=box.getSize(new THREE.Vector3());
      const maxSize=Math.max(dim.x,dim.y,dim.z);
      const heroHeight=heroBounds.getSize(new THREE.Vector3()).y;
      const bone=handBone(descriptor.slot==="MAIN_HAND"?"R":"L");
      const wScale=bone.getWorldScale(new THREE.Vector3());
      const inheritedScale=Math.max(Math.abs(wScale.x),Math.abs(wScale.y),Math.abs(wScale.z));
      if(!Number.isFinite(maxSize*inheritedScale)||maxSize<=0||inheritedScale<=0)
        throw new Error("G013_UNBOUNDED_MESH_OR_RIG");
      const pivot=box.getCenter(new THREE.Vector3());
      if(descriptor.slot==="MAIN_HAND")pivot.y=box.min.y;
      const group=new THREE.Group();
      group.name="G013_NONRELEASE_"+descriptor.asset_id;
      group.userData={slot:descriptor.slot,sha256:sha,qa_only:true,
        release_admitted:false};
      const scale=(heroHeight*(descriptor.slot==="MAIN_HAND"?0.27:0.31))/
        (maxSize*inheritedScale);
      model.position.sub(pivot);
      group.scale.setScalar(scale);
      group.add(model);
      return group;
    }
  });
  heroBounds = new THREE.Box3().setFromObject(root);
  render();
  const gl = renderer.getContext();
  const info = gl.getExtension("WEBGL_debug_renderer_info");
  return {
    characterKey,
    heroPath,
    heroMeshCount: root.getObjectByProperty("isMesh", true) ? 1 : 0,
    animations: animations.map((clip) => clip.name),
    glRenderer: info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
    webgl2: renderer.capabilities.isWebGL2,
    liveRenderers,
    maxRenderers,
  };
};

window.setGripPose = (pose) => {
  if (!host || !root) throw new Error("real_hero_not_started");
  adapter.detach("MAIN_HAND");
  activeWeapon = null;
  if (pose === "A1_CORRECT_MID") {
    if (currentCharacter !== "A1") throw new Error("wrong_hero_for_correct_animation");
    const clip = animations.find((entry) => entry.name === "Correct");
    if (!clip) throw new Error("real_a1_correct_animation_missing");
    const mixer = new THREE.AnimationMixer(root);
    mixer.clipAction(clip).play();
    mixer.setTime(clip.duration * 0.5);
  } else if (pose === "A3_RAISED_ARM") {
    if (currentCharacter !== "A3") throw new Error("wrong_hero_for_raised_arm");
    const arm = poseBone("upperarmr");
    arm.rotation.z += 0.55;
    arm.rotation.x += 0.20;
  } else if (pose !== "DEFAULT") {
    throw new Error("unknown_real_grip_pose:" + pose);
  }
  root.updateMatrixWorld(true);
  heroBounds = new THREE.Box3().setFromObject(root);
  render();
  return { pose, rightHand: handBone("R").getWorldPosition(new THREE.Vector3()).toArray(),
    leftHand: handBone("L").getWorldPosition(new THREE.Vector3()).toArray() };
};

window.attachG017Main = async ({assetId}) => {
 const item=rows.get(assetId);
 if(!item||item.slot!=="MAIN_HAND"||item.official_equip_allowed!==false)
  throw new Error("G017_MAIN_HAND_QA_NOT_AUTHORIZED");
 const attached=await adapter.setHand("MAIN_HAND",item,appearanceContext());
 root.updateMatrixWorld(true);
 render();
 const bone=handBone("R");
 const anchor=root.getObjectByName("G009_SHARED_HERO_SLOT_MAIN_HAND");
 const child=anchor?.children[0];
 if(!anchor||!child)throw new Error("G017_NO_SCENE_CHILD");
 const box=new THREE.Box3().setFromObject(child);
 const dims=box.getSize(new THREE.Vector3());
 const heroHeight=heroBounds.getSize(new THREE.Vector3()).y;
 const met={slot:"MAIN_HAND",asset_id:assetId,functional_class:item.functional_class,
  attachStatus:attached.status,anchorSource:anchor.userData.anchor_source,
  boneMatrixDelta:matrixDelta(anchor.matrixWorld,bone.matrixWorld),
  centerHandRatio:bone.getWorldPosition(new THREE.Vector3())
    .distanceTo(box.getCenter(new THREE.Vector3()))/heroHeight,
  maxDimensionRatio:Math.max(dims.x,dims.y,dims.z)/heroHeight,
  intersectsHero:heroBounds.clone().expandByScalar(heroHeight*0.25).intersectsBox(box),
  boundEmpty:box.isEmpty(),childCount:anchor.children.length,
  actualSha:child.userData.sha256,rendererCount:liveRenderers};
 return {characterKey:currentCharacter,assetId,metric:met,
   mainCount:host.diagnostics().slots.find(x=>x.slot==="MAIN_HAND").child_count,
   offCount:host.diagnostics().slots.find(x=>x.slot==="OFF_HAND").child_count,
   liveRenderers,maxRenderers};
};
window.gripDiagnostics = () => ({ liveRenderers, maxRenderers });
window.closeGripScene = () => { closeHero(); return { liveRenderers, maxRenderers }; };
window.__g017P022Ready = true;
</script>
</html>
