<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zone 3 presentation FX fixture</title>
    <link rel="stylesheet" href="/css/e9/zone3_presentation_fx.css">
    <style>
        html, body { margin: 0; min-height: 100%; background: #0e171a; }
        body { display: grid; place-items: center; padding: 12px; box-sizing: border-box; }
        #stage { width: min(100%, 1180px); aspect-ratio: 16 / 9; border-radius: 12px; }
        [data-z3-camera-target] { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <main id="stage" class="z3-fx-stage" data-zone-key="k16_20" aria-label="Zone 3 visual presentation stage">
        <div data-z3-camera-target>
            <img src="/assets/e10/art/zone3/cinematic/zone3_shot05.webp" alt="Goblin Cave water route and settlement">
        </div>
    </main>
    <script src="/js/e9/zone3_presentation_fx.js"></script>
    <script>
        window.__z3 = window.GoOdysseyZone3PresentationFX.create({
            root: document.getElementById('stage'),
        });
        window.__z3Ready = true;
    </script>
</body>
</html>
