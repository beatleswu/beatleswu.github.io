<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A033 Reward Drop Presentation Showcase</title>
  <link rel="stylesheet" href="/css/e10/reward_drop_presentation_v1.css?v=a033v2">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      color: #173653;
      background:
        linear-gradient(rgba(23,54,83,.12), rgba(23,54,83,.12)),
        url('/assets/main_adventure_map_clean_new.webp') center / cover fixed;
    }
    .showcase {
      width: min(760px, 100%);
      min-height: 420px;
      padding: 32px;
      border: 10px solid rgba(23,54,83,.88);
      border-radius: 24px;
      background: rgba(255,244,216,.9);
      box-shadow: 0 24px 80px rgba(23,54,83,.34);
    }
    h1 { margin: 0 0 8px; font: 700 34px/1.05 Georgia, serif; }
    p { margin: 0; color: #35556b; line-height: 1.5; }
    .note { margin-top: 22px; padding: 14px; border-radius: 12px; background: rgba(221,242,255,.8); }
  </style>
  <script>
    const params = new URLSearchParams(location.search);
    window.I18n = { getLang: () => params.get('lang') === 'en' ? 'en' : 'zh' };
  </script>
  <script src="/js/game/reward_drop_presentation_v1.js?v=a033v2"></script>
</head>
<body>
  <main class="showcase">
    <h1>Go Odyssey · Reward Result</h1>
    <p>Controlled local presentation fixture. Reward truth is supplied by the test-shaped committed result below.</p>
    <p class="note">Generic Monster V1 · server result in / presentation only</p>
  </main>
  <section id="reward-drop-v1" hidden aria-live="polite" aria-atomic="true">
    <div class="reward-drop-v1__card" role="status">
      <div class="reward-drop-v1__art-wrap"><div id="reward-drop-v1-art"></div></div>
      <div class="reward-drop-v1__body">
        <div class="reward-drop-v1__eyebrow" id="reward-drop-v1-title"></div>
        <div class="reward-drop-v1__name" id="reward-drop-v1-name"></div>
        <div class="reward-drop-v1__meta" id="reward-drop-v1-meta"></div>
        <div class="reward-drop-v1__state" id="reward-drop-v1-state"></div>
        <div class="reward-drop-v1__actions">
          <a id="reward-drop-v1-backpack" hidden href="/inventory"></a>
          <button id="reward-drop-v1-close" type="button"></button>
        </div>
      </div>
    </div>
  </section>
  <script>
    const state = params.get('state') || 'functional';
    const payloads = {
      functional: {
        ok: true,
        loot: {
          functional_equipment: true,
          item_id: 'wooden_sword',
          display_name: '木劍',
          display_name_en: 'Wooden Sword',
          slot: 'weapon',
          icon: '/assets/hero/equipment/functional/wooden_sword.svg',
          rarity: 'common',
          inv_id: 41,
        },
      },
      cosmetic: {
        ok: true,
        appearance_loot: {
          id: 'robe_fox',
          name: '妖狐錦袍',
          name_en: 'Fox Robe',
          emoji: '🧣',
          rarity: 'rare',
          icon: '/assets/hero/items/robe_fox.svg',
        },
      },
      no_drop: {
        ok: true,
        monster: { defeated: true },
        monster_settlement: {
          defeated: true,
          duplicate: false,
          functional_lineage_count: 0,
          wardrobe_lineage_count: 0,
        },
      },
    };
    window.RewardDropPresentationV1.renderCommittedResult(
      payloads[state] || payloads.no_drop,
    );
  </script>
</body>
</html>
