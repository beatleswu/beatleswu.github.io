<script>
(() => {
  const E10_BACKPACK_SHELL_OWNER = 'e10-backpack';
  const e10BackpackMode = new URLSearchParams(location.search).get('e10') === '1';
  window.__GO_E10_BACKPACK_MODE__ = e10BackpackMode;
  window.__GO_ADVENTURE_SHELL_OWNER__ = e10BackpackMode ? E10_BACKPACK_SHELL_OWNER : null;
  const root = document.documentElement;
  if (!e10BackpackMode) {
    root.removeAttribute('data-adventure-shell-owner');
    return;
  }
  root.dataset.adventureShellOwner = E10_BACKPACK_SHELL_OWNER;
  root.dataset.e10BackpackShell = 'true';
  root.dataset.e10VisualSkin = 'immersive-rpg';
  root.dataset.e10ArtKit = 'runtime-v1';
  const marker = document.createElement('meta');
  marker.name = 'go-odyssey-static-contract';
  marker.content = 'e10-vs1f-integrated-world-map';
  document.head.appendChild(marker);
})();
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
    --cream:    #faf7f2;
    --cream2:   #f3ede3;
    --cream3:   #ede4d4;
    --ink:      #1c1409;
    --ink2:     #3d2f1a;
    --ink3:     #6b5740;
    --ink4:     #a89070;
    --amber:    #d97706;
    --amber-bg: #fffbeb;
    --teal:     #0d9488;
    --teal-bg:  #f0fdfa;
    --teal-mid: #99f6e4;
    --border:   #e5ddd0;
    --border2:  #d4c9b8;
    --white:    #ffffff;
    --surface2: #f6f1ea;
    --shadow:   0 1px 3px rgba(28,20,9,.06), 0 4px 16px rgba(28,20,9,.06);
    --shadow-lg:0 8px 40px rgba(28,20,9,.12);
    --green:    #16a34a;
    --red:      #dc2626;
    --red-bg:   #fef2f2;
    --mono:     'DM Mono', monospace;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 52px 52px; opacity: .35;
}

/* ══ HEADER ══════════════════════════════════════════════════ */
header:not(.cg-nav) {
    position: sticky; top: 0; z-index: 100;
    background: rgba(250,247,242,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
}
.logo {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 700; color: var(--ink);
    text-decoration: none; letter-spacing: .5px;
}
.logo-mark {
    width: 26px; height: 26px; border-radius: 50%; background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: white;
}
.header-nav { display: flex; align-items: center; gap: 4px; }
.nav-link {
    font-size: 14px; color: var(--ink3); text-decoration: none;
    padding: 7px 13px; border-radius: 6px; transition: all .15s;
    display: flex; align-items: center; gap: 4px;
}
.nav-link:hover { background: var(--cream2); color: var(--ink); }
.nav-link.active { background: var(--teal-bg); color: var(--teal); }
.nav-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.btn-logout {
    font-size: 11px; color: var(--ink3); background: none; border: none;
    cursor: pointer; padding: 4px 8px; border-radius: 5px; transition: all .15s;
}
.btn-logout:hover { background: var(--red-bg); color: var(--red); }

/* ══ STATS STRIP ═════════════════════════════════════════════ */
.stats-strip {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex; align-items: center; gap: 40px;
    position: relative; z-index: 10;
    flex-wrap: wrap;
}
.strip-stat { text-align: center; min-width: 70px; }
.strip-stat .s-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px; font-weight: 700; line-height: 1;
}
.strip-stat .s-val.teal  { color: var(--teal); }
.strip-stat .s-val.amber { color: var(--amber); }
.strip-stat .s-val.gold  { color: #b45309; }
.strip-stat .s-lbl {
    font-size: 10px; color: var(--ink3); font-family: var(--mono);
    letter-spacing: .5px; margin-top: 3px;
}

/* ══ MAIN ════════════════════════════════════════════════════ */
main {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto;
    padding: 32px 28px 80px;
}
.section-label {
    font-family: var(--mono);
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
}
.section-label::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
}
.section-wrap { margin-bottom: 40px; }

/* ══ COIN CARD ════════════════════════════════════════════════ */
.coin-card {
    background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fff9e6 100%);
    border: 1.5px solid #fbbf24;
    border-radius: 20px;
    padding: 32px 36px;
    display: flex; align-items: center; gap: 32px;
    box-shadow: 0 4px 24px rgba(217,119,6,.12);
    position: relative; overflow: hidden;
}
.coin-card::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
        45deg, transparent, transparent 20px,
        rgba(251,191,36,.06) 20px, rgba(251,191,36,.06) 21px
    );
    pointer-events: none;
}
.coin-icon-big {
    font-size: 64px;
    filter: drop-shadow(0 4px 12px rgba(217,119,6,.4));
    flex-shrink: 0;
    animation: coinFloat 3s ease-in-out infinite;
}
@keyframes coinFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
}
.coin-info { flex: 1; }
.coin-info .coin-label {
    font-size: 11px; font-family: var(--mono); letter-spacing: 3px;
    text-transform: uppercase; color: var(--amber); margin-bottom: 8px;
}
.coin-info .coin-amount {
    font-family: 'Cormorant Garamond', serif;
    font-size: 60px; font-weight: 700; line-height: 1;
    color: #92400e;
}
.coin-info .coin-sub {
    font-size: 13px; color: var(--ink3); margin-top: 6px;
}

/* ══ HOW TO EARN ══════════════════════════════════════════════ */
.earn-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
}
.earn-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex; align-items: flex-start; gap: 12px;
    transition: all .15s;
}
.earn-card:hover { border-color: var(--amber); box-shadow: var(--shadow); }
.earn-card .ec-icon { font-size: 28px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
.earn-card .ec-title { font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 4px; }
.earn-card .ec-desc  { font-size: 12px; color: var(--ink3); line-height: 1.5; }
.earn-card .ec-rate  {
    margin-top: 6px; display: inline-block;
    font-size: 10px; font-family: var(--mono); font-weight: 600;
    background: var(--amber-bg); color: var(--amber);
    border: 1px solid #fde68a; border-radius: 99px; padding: 2px 8px;
}

/* ══ COMING SOON ══════════════════════════════════════════════ */
.coming-soon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
}
.cs-card {
    background: var(--white);
    border: 1px dashed var(--border2);
    border-radius: 14px;
    padding: 20px 12px;
    text-align: center;
    opacity: .7;
    position: relative;
}
.cs-card .cs-icon    { font-size: 32px; margin-bottom: 8px; filter: grayscale(.5); }
.cs-card .cs-name    { font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 4px; }
.cs-card .cs-tag     {
    font-size: 9px; font-family: var(--mono); letter-spacing: 1px;
    background: var(--cream2); color: var(--ink3);
    border-radius: 99px; padding: 2px 8px; display: inline-block;
}

/* ══ CHALLENGE STATS ══════════════════════════════════════════ */
.challenge-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
}
.cstat-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}
.cstat-card .cstat-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px; font-weight: 700; line-height: 1; color: var(--teal);
    margin-bottom: 6px;
}
.cstat-card .cstat-val.amber { color: var(--amber); }
.cstat-card .cstat-val.gold  { color: #b45309; }
.cstat-card .cstat-lbl {
    font-size: 11px; font-family: var(--mono); color: var(--ink3);
}

/* ══ MOBILE ══════════════════════════════════════════════════ */
@media (max-width: 640px) {
    header:not(.cg-nav) { padding: 0 14px; }
    .header-nav .nav-link { display: none; }
    main { padding: 20px 16px 72px; }
    .stats-strip { padding: 12px 16px; gap: 20px; }
    .coin-card { flex-direction: column; text-align: center; padding: 24px 20px; gap: 16px; }
    .coin-info .coin-amount { font-size: 48px; }
    .coin-icon-big { font-size: 48px; }
}

    /* ── ≤1366px：手機/iPad 用統一 32x32 圖示 nav ── */
    @media (max-width: 1366px) {
        header:not(.cg-nav) { padding: 0 10px !important; height: 50px !important; }
        .logo-name { display: none !important; }
        .nav-avatar-wrap, .status-pill, .nav-sep { display: none !important; }
        .header-nav { gap: 3px !important; flex-wrap: nowrap; overflow-x: auto; }
        #menu-btn { display: flex !important; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0 !important; font-size: 18px !important; flex-shrink: 0; background: none; border: none; cursor: pointer; }
        #streak-pill { font-size: 10px !important; padding: 2px 8px !important; flex-shrink: 0; }
        .header-nav .nav-link {
            display: inline-flex !important;
            align-items: center; justify-content: center;
            width: 32px !important; height: 32px !important;
            padding: 0 !important;
            border-radius: 8px;
            font-size: 0 !important;
            background: transparent;
            flex-shrink: 0;
            position: relative;
        }
        .header-nav .nav-link::before {
            content: attr(data-icon);
            font-size: 18px !important;
            line-height: 1;
        }
        .header-nav .nav-link:hover { background: var(--cream2); }
        .header-nav .nav-link > span:not(#mistake-badge):not(#coins-nav-count) { display: none !important; }
        .header-nav .nav-link svg { width: 22px !important; height: 22px !important; display: block !important; }
        .header-nav .nav-link[href="/play"]::before { content: none !important; }
        .header-nav #coins-nav-btn { width: auto !important; min-width: 32px; padding: 0 6px !important; gap: 2px; }
        .header-nav #coins-nav-btn #coins-nav-count {
            display: inline !important;
            font-size: 11px !important;
            font-family: 'DM Mono', monospace;
            color: var(--amber);
        }
        .header-nav .nav-link[href="/mistakes"] { position: relative; }
        #mistake-badge {
            position: absolute !important;
            top: -2px !important; right: -2px !important;
            font-size: 8px !important;
            padding: 0 4px !important;
            line-height: 1.4 !important;
        }
        #xp-hud { font-size: 10px !important; gap: 4px !important; padding: 2px 6px !important; flex-shrink: 0; }
        #xp-bar-wrap { width: 50px !important; }
    }

.backpack-shell { padding-bottom: 24px; }
.backpack-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:18px; }
.backpack-heading h1 { font:700 clamp(28px,4vw,42px)/1.1 'Cormorant Garamond',serif; color:var(--ink); }

.backpack-status { border:1px solid var(--border); border-radius:12px; padding:14px; color:var(--ink3); background:var(--surface2); }
.backpack-status[data-state="ready"] { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); padding:0; border:0; }
.backpack-status[data-state="error"] { color:var(--red); background:var(--red-bg); }
.backpack-filters { display:flex; gap:8px; overflow-x:auto; padding:16px 0 12px; scrollbar-width:thin; }
.backpack-filter { flex:0 0 auto; min-height:40px; padding:0 14px; border:1px solid var(--border); border-radius:999px; background:#fff; color:var(--ink3); font-weight:700; cursor:pointer; }
.backpack-filter[aria-selected="true"] { border-color:var(--teal); background:var(--teal-bg); color:var(--teal); }
.backpack-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; min-height:120px; }
.backpack-card { display:flex; flex-direction:column; gap:10px; min-width:0; border:1px solid var(--border); border-radius:14px; background:#fff; padding:15px; box-shadow:var(--shadow); }
.backpack-card-head { display:flex; align-items:center; gap:10px; }
.backpack-card-icon { width:48px; height:48px; display:grid; place-items:center; flex:0 0 auto; border-radius:12px; background:var(--cream2); font-size:28px; }
.backpack-card-name { color:var(--ink); font-size:15px; font-weight:800; overflow-wrap:anywhere; }
.backpack-card-meta { margin-top:3px; color:var(--ink3); font:500 10px/1.35 var(--mono); }
.backpack-card-desc { flex:1; color:var(--ink3); font-size:12px; line-height:1.6; }
.backpack-card-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.backpack-action-state { color:var(--teal); font-size:11px; font-weight:700; }
.backpack-use { min-height:40px; padding:0 14px; border:0; border-radius:9px; background:var(--teal); color:#fff; font-weight:800; cursor:pointer; }
.backpack-use:disabled { opacity:.55; cursor:wait; }
.backpack-empty { grid-column:1/-1; padding:36px 18px; border:1px dashed var(--border2); border-radius:14px; text-align:center; color:var(--ink3); background:var(--surface2); }
.backpack-toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:1000; transform:translate(-50%,16px); opacity:0; pointer-events:none; transition:.18s; border-radius:10px; background:var(--ink); color:#fff; padding:10px 14px; }
.backpack-toast.show { opacity:1; transform:translate(-50%,0); }
@media (max-width:700px) {
  .backpack-heading { flex-direction:column; }
  .backpack-shop-link { width:100%; justify-content:center; }
  .backpack-grid { grid-template-columns:1fr; padding-bottom:calc(78px + env(safe-area-inset-bottom)); }
}
</style>

<div class="e10-backpack-dialog" id="e10-backpack-dialog" role="dialog" aria-modal="true" aria-labelledby="e10-backpack-dialog-title" aria-describedby="e10-backpack-dialog-description" aria-hidden="true" hidden>
  <div class="e10-backpack-dialog-backdrop" data-e10-dialog-dismiss></div>
  <section class="e10-backpack-dialog-panel" tabindex="-1">
    <header class="e10-backpack-dialog-header">
      <div>
        <p class="backpack-kicker" data-e10-dialog-kicker>ITEM DETAIL</p>
        <h2 class="e10-backpack-dialog-title" id="e10-backpack-dialog-title"></h2>
      </div>
      <button class="e10-backpack-dialog-close" type="button" data-e10-dialog-close aria-label="關閉物品詳情">
        <img src="/assets/e10/ui/icons/close.webp" alt="" width="256" height="256" decoding="async" draggable="false">
      </button>
    </header>
    <div class="e10-backpack-dialog-identity">
      <div class="e10-backpack-dialog-icon" id="e10-backpack-dialog-icon" aria-hidden="true"></div>
      <div>
        <span class="e10-backpack-dialog-rarity" id="e10-backpack-dialog-rarity"></span>
        <p class="backpack-card-meta" id="e10-backpack-dialog-meta"></p>
      </div>
    </div>
    <p class="e10-backpack-dialog-copy" id="e10-backpack-dialog-description"></p>
    <div class="e10-backpack-dialog-status" id="e10-backpack-dialog-status"></div>
    <button class="backpack-use e10-backpack-dialog-use" id="e10-backpack-dialog-use" type="button" hidden></button>
  </section>
</div>

<script>
async function doLogout() {
  await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
  window.location.href = '/login';
}

const BACKPACK_CATEGORIES = [
  { key:'all', label:{ zh:'全部', en:'All' }, match:() => true },
  { key:'consumable', label:{ zh:'消耗品', en:'Consumables' }, match:item => !!item.usable },
  { key:'training', label:{ zh:'修行補給', en:'Training' }, match:item => item.category === 'training' },
  { key:'growth', label:{ zh:'成長藥劑', en:'Growth' }, match:item => item.category === 'growth' },
  { key:'guard', label:{ zh:'守護道具', en:'Protection' }, match:item => item.category === 'guard' },
  { key:'collection', label:{ zh:'收藏品', en:'Collection' }, match:item => item.category === 'collection' },
  { key:'quest', label:{ zh:'任務道具', en:'Quest' }, match:item => item.category === 'quest' },
  { key:'material', label:{ zh:'素材', en:'Materials' }, match:item => item.category === 'pet' || item.category === 'material' },
  { key:'chest', label:{ zh:'寶箱', en:'Chests' }, match:item => item.category === 'chest' || /chest/i.test(item.key || '') },
  { key:'exchange', label:{ zh:'兌換物', en:'Exchange' }, match:item => item.category === 'exchange' },
  { key:'other', label:{ zh:'其他', en:'Other' }, match:item => !['training','growth','guard','collection','quest','pet','material','chest','exchange'].includes(item.category) },
];
let backpackItems = [];
let activeBackpackCategory = 'all';
let backpackToastTimer = null;
let e10BackpackDialogTrigger = null;

const E10_BACKPACK_MODE = window.__GO_E10_BACKPACK_MODE__ === true;

function backpackIsEn() { return typeof I18n !== 'undefined' && I18n.getLang && I18n.getLang() === 'en'; }
function backpackText(zh, en) { return backpackIsEn() ? en : zh; }
function backpackName(item) { return backpackIsEn() ? (item.name_en || item.name || item.key) : (item.name || item.name_en || item.key); }
function backpackDescription(item) { return backpackIsEn() ? (item.desc_en || item.desc || '') : (item.desc || item.desc_en || ''); }
function backpackCategory(item) {
  return BACKPACK_CATEGORIES.find(category => category.key !== 'all' && category.key !== 'consumable' && category.key !== 'other' && category.match(item))
    || BACKPACK_CATEGORIES.find(category => category.key === 'other');
}
function backpackCapability(item) {
  if (item.capability === 'spirit_managed') return { kind:'managed', label:backpackText('在棋靈頁合法使用','Use from the Spirit domain') };
  if (item.usable === 'activate') return { kind:'manual', label:backpackText('可手動使用','Manual use') };
  if (item.usable === 'auto') return { kind:'automatic', label:backpackText('符合條件時自動消耗','Used automatically when eligible') };
  if (item.usable === 'in_question') return { kind:'automatic', label:backpackText('答題時條件使用','Conditionally used while solving') };
  if (item.usable === 'instant') return { kind:'automatic', label:backpackText('取得時自動生效','Applied automatically when acquired') };
  return { kind:'readonly', label:backpackText('被動生效／唯讀','Passive / read-only') };
}
function backpackRarity(item) {
  const raw = String(item.rarity || item.rarity_tier || item.quality || 'common').toLowerCase();
  const key = ['common','uncommon','rare','epic','legendary'].includes(raw) ? raw : 'common';
  const labels = {
    common: { zh:'普通', en:'Common' },
    uncommon: { zh:'非凡', en:'Uncommon' },
    rare: { zh:'稀有', en:'Rare' },
    epic: { zh:'史詩', en:'Epic' },
    legendary: { zh:'傳說', en:'Legendary' },
  };
  return { key, label:backpackIsEn() ? labels[key].en : labels[key].zh };
}
function initE10BackpackShell() {
  if (!E10_BACKPACK_MODE) return;
  const owner = 'e10-backpack';
  const previousOwner = window.__GO_ADVENTURE_SHELL_OWNER__
    || document.body.getAttribute('data-adventure-shell-owner')
    || document.documentElement.getAttribute('data-adventure-shell-owner')
    || null;
  window.__GO_ADVENTURE_SHELL_OWNER__ = owner;
  document.body.setAttribute('data-adventure-shell-owner', owner);
  document.documentElement.setAttribute('data-adventure-shell-owner', owner);
  document.body.dataset.e10BackpackShell = 'true';
  document.body.dataset.e10VisualSkin = 'immersive-rpg';
  document.body.dataset.e10ArtKit = 'runtime-v1';
  if (previousOwner !== owner) {
    document.dispatchEvent(new CustomEvent('e10:adventure-shell-owner-changed', {
      detail: { owner },
    }));
  }
  document.querySelectorAll('[data-legacy-backpack-header]').forEach((node) => { node.hidden = true; });
  document.querySelectorAll('[data-e10-backpack-only]').forEach((node) => { node.hidden = false; });
  const close = document.querySelector('[data-e10-dialog-close]');
  const dismiss = document.querySelector('[data-e10-dialog-dismiss]');
  if (close) close.addEventListener('click', () => closeBackpackDetails());
  if (dismiss) dismiss.addEventListener('click', () => closeBackpackDetails());
  document.addEventListener('keydown', (event) => {
    const dialog = document.getElementById('e10-backpack-dialog');
    if (!dialog || dialog.hidden) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      closeBackpackDetails();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusables = [...dialog.querySelectorAll('button:not([disabled]):not([hidden]), [href]:not([hidden])')];
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });
}
function openBackpackDetails(item, trigger) {
  if (!E10_BACKPACK_MODE) return;
  const dialog = document.getElementById('e10-backpack-dialog');
  if (!dialog) return;
  const capability = backpackCapability(item);
  const rarity = backpackRarity(item);
  e10BackpackDialogTrigger = trigger || null;
  document.getElementById('e10-backpack-dialog-title').textContent = backpackName(item);
  document.getElementById('e10-backpack-dialog-icon').textContent = item.icon || '🎒';
  document.getElementById('e10-backpack-dialog-rarity').textContent = rarity.label;
  document.getElementById('e10-backpack-dialog-meta').textContent = `${backpackText('持有','Owned')}: ${item.quantity} · ${backpackIsEn() ? backpackCategory(item).label.en : backpackCategory(item).label.zh}`;
  document.getElementById('e10-backpack-dialog-description').textContent = backpackDescription(item);
  document.getElementById('e10-backpack-dialog-status').textContent = capability.label;
  const useButton = document.getElementById('e10-backpack-dialog-use');
  useButton.hidden = capability.kind !== 'manual';
  useButton.textContent = backpackText('使用物品','Use item');
  useButton.onclick = () => {
    const card = [...document.querySelectorAll('[data-source-item-id]')].find((node) => node.dataset.sourceItemId === item.key);
    const cardButton = card && card.querySelector('[data-use-item]');
    closeBackpackDetails(false);
    if (cardButton) useBackpackItem(item.key, cardButton);
  };
  dialog.hidden = false;
  dialog.setAttribute('aria-hidden', 'false');
  document.body.classList.add('e10-backpack-dialog-open');
  document.querySelector('.e10-backpack-dialog-panel')?.focus();
}
function closeBackpackDetails(restoreFocus = true) {
  const dialog = document.getElementById('e10-backpack-dialog');
  if (!dialog || dialog.hidden) return;
  dialog.hidden = true;
  dialog.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('e10-backpack-dialog-open');
  const trigger = e10BackpackDialogTrigger;
  e10BackpackDialogTrigger = null;
  if (restoreFocus && trigger && document.contains(trigger)) trigger.focus();
}
function focusE10BackpackCategory(index) {
  const categories = BACKPACK_CATEGORIES;
  const next = (index + categories.length) % categories.length;
  activeBackpackCategory = categories[next].key;
  const url = new URL(location.href);
  if (activeBackpackCategory === 'all') url.searchParams.delete('category');
  else url.searchParams.set('category', activeBackpackCategory);
  history.pushState({ backpackCategory:activeBackpackCategory }, '', url);
  renderBackpackFilters();
  renderBackpackGrid();
  document.querySelector(`[data-category="${activeBackpackCategory}"]`)?.focus();
}
function showBackpackToast(message) {
  const toast = document.getElementById('backpack-toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(backpackToastTimer);
  backpackToastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}
function setBackpackStatus(state, message) {
  const status = document.getElementById('backpack-status');
  status.dataset.state = state;
  status.textContent = message;
}
function renderBackpackFilters() {
  const root = document.getElementById('backpack-filters');
  root.innerHTML = '';
  BACKPACK_CATEGORIES.forEach(category => {
    const count = backpackItems.filter(category.match).length;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'backpack-filter';
    button.role = 'tab';
    button.dataset.category = category.key;
    button.setAttribute('aria-selected', String(activeBackpackCategory === category.key));
    if (E10_BACKPACK_MODE) {
      button.setAttribute('aria-controls', 'backpack-grid');
      button.tabIndex = activeBackpackCategory === category.key ? 0 : -1;
    }
    button.textContent = `${backpackIsEn() ? category.label.en : category.label.zh} ${count}`;
    button.addEventListener('click', () => {
      activeBackpackCategory = category.key;
      const url = new URL(location.href);
      if (category.key === 'all') url.searchParams.delete('category');
      else url.searchParams.set('category', category.key);
      history.pushState({ backpackCategory:category.key }, '', url);
      renderBackpackFilters();
      renderBackpackGrid();
    });
    if (E10_BACKPACK_MODE) button.addEventListener('keydown', (event) => {
      const current = BACKPACK_CATEGORIES.findIndex((entry) => entry.key === category.key);
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        event.preventDefault();
        focusE10BackpackCategory(current + 1);
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        event.preventDefault();
        focusE10BackpackCategory(current - 1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        focusE10BackpackCategory(0);
      } else if (event.key === 'End') {
        event.preventDefault();
        focusE10BackpackCategory(BACKPACK_CATEGORIES.length - 1);
      }
    });
    root.appendChild(button);
  });
}
function renderBackpackGrid() {
  const grid = document.getElementById('backpack-grid');
  const category = BACKPACK_CATEGORIES.find(item => item.key === activeBackpackCategory) || BACKPACK_CATEGORIES[0];
  const visible = backpackItems.filter(category.match);
  grid.innerHTML = '';
  if (!visible.length) {
    grid.innerHTML = `<div class="backpack-empty">${backpackText('此分類目前沒有持有物品。','No owned items in this category.')}</div>`;
    return;
  }
  visible.forEach(item => {
    const capability = backpackCapability(item);
    const rarity = backpackRarity(item);
    const card = document.createElement('article');
    card.className = `backpack-card${E10_BACKPACK_MODE ? ' e10-backpack-card' : ''}`;
    card.dataset.sourceItemId = item.key;
    card.dataset.itemCapability = capability.kind;
    card.dataset.itemCategory = backpackCategory(item).key;
    card.dataset.inventorySource = item.inventory_source || 'shop_inventory';
    if (E10_BACKPACK_MODE) card.dataset.itemRarity = rarity.key;
    card.innerHTML = `
      <div class="backpack-card-head">
        <div class="backpack-card-icon" aria-hidden="true">${item.icon || '🎒'}</div>
        ${E10_BACKPACK_MODE ? `<span class="e10-backpack-rarity">${rarity.label}</span>` : ''}
        <div><div class="backpack-card-name">${backpackName(item)}</div>
        <div class="backpack-card-meta">${backpackText('持有','Owned')}: ${item.quantity} · ${backpackIsEn() ? backpackCategory(item).label.en : backpackCategory(item).label.zh}</div></div>
      </div>
      <p class="backpack-card-desc">${backpackDescription(item)}</p>
      <div class="backpack-card-foot"><span class="backpack-action-state"${E10_BACKPACK_MODE ? ` data-e10-backpack-status="${capability.kind}"` : ''}>${capability.label}</span>
      ${E10_BACKPACK_MODE ? `<button type="button" class="e10-backpack-details" data-item-details="${item.key}">${backpackText('查看詳情','Details')}</button>` : ''}
      ${capability.kind === 'manual' ? `<button type="button" class="backpack-use" data-use-item="${item.key}">${backpackText('使用','Use')}</button>` : ''}</div>`;
    const useButton = card.querySelector('[data-use-item]');
    if (useButton) useButton.addEventListener('click', () => useBackpackItem(item.key, useButton));
    const detailsButton = card.querySelector('[data-item-details]');
    if (detailsButton) detailsButton.addEventListener('click', () => openBackpackDetails(item, detailsButton));
    grid.appendChild(card);
  });
  const focusKey = new URLSearchParams(location.search).get('focus');
  if (focusKey) {
    const focused = [...grid.querySelectorAll('.backpack-card')].find(card => card.dataset.sourceItemId === focusKey);
    if (focused) { focused.style.outline = '3px solid var(--amber)'; focused.scrollIntoView({ block:'nearest' }); }
  }
}
async function useBackpackItem(itemKey, button) {
  button.disabled = true;
  try {
    const response = await fetch('/api/shop/use', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ item_key:itemKey })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.error) throw new Error(result.message || result.error || `HTTP ${response.status}`);
    showBackpackToast(backpackText('物品已合法使用。','Item used successfully.'));
    await loadBackpack();
  } catch (error) {
    button.disabled = false;
    showBackpackToast(error.message || backpackText('使用失敗。','Use failed.'));
  }
}
async function loadBackpack() {
  setBackpackStatus('loading', backpackText('正在載入背包…','Loading Backpack…'));
  try {
    const [catalogResponse, meResponse, petResponse] = await Promise.all([
      fetch('/api/shop/catalog', { credentials:'include', cache:'no-store' }),
      fetch('/api/auth/me', { credentials:'include', cache:'no-store' }),
      fetch('/api/pet/status', { credentials:'include', cache:'no-store' }),
    ]);
    if (!catalogResponse.ok) throw new Error(`HTTP ${catalogResponse.status}`);
    if (!petResponse.ok) throw new Error(`Pet inventory HTTP ${petResponse.status}`);
    const catalog = await catalogResponse.json();
    const me = meResponse.ok ? await meResponse.json() : {};
    const petStatus = await petResponse.json();
    const definitions = new Map((catalog.items || []).map(item => [item.key, item]));
    backpackItems = Object.entries(catalog.inventory || {}).filter(([, quantity]) => Number(quantity) > 0).map(([key, quantity]) => ({
      ...(definitions.get(key) || { key, name:key, name_en:key, category:'other', usable:null, icon:'🎒', desc:'', desc_en:'' }),
      key,
      quantity:Number(quantity),
      inventory_source:'shop_inventory',
    }));
    const petInventory = (petStatus.inventory || []).filter(item => Number(item.qty) > 0).map(item => ({
      ...item,
      key:item.key,
      quantity:Number(item.qty),
      category:'material',
      capability:'spirit_managed',
      inventory_source:'pet_inventory',
      icon:item.icon || '🍬',
      desc:item.desc || '棋靈補給；請在棋靈頁依既有餵食契約使用。',
      desc_en:item.desc_en || 'Spirit supply; use it through the existing Spirit feeding contract.',
    }));
    backpackItems.push(...petInventory.filter(item => !backpackItems.some(existing => existing.key === item.key)));
    const requested = new URLSearchParams(location.search).get('category') || 'all';
    activeBackpackCategory = BACKPACK_CATEGORIES.some(category => category.key === requested) ? requested : 'all';
    document.getElementById('username-display').textContent = me.display_name || me.nickname || me.username || 'Player';
    const e10User = document.querySelector('[data-e10-backpack-user]');
    if (e10User) e10User.textContent = me.display_name || me.nickname || me.username || 'Player';
    document.getElementById('backpack-total-qty').textContent = backpackItems.reduce((total, item) => total + item.quantity, 0).toLocaleString();
    document.getElementById('backpack-item-kinds').textContent = backpackItems.length.toLocaleString();
    document.getElementById('backpack-manual-count').textContent = backpackItems.filter(item => backpackCapability(item).kind === 'manual').length.toLocaleString();
    document.getElementById('backpack-auto-count').textContent = backpackItems.filter(item => backpackCapability(item).kind === 'automatic').length.toLocaleString();
    setBackpackStatus('ready', backpackText('背包已載入。','Backpack loaded.'));
    renderBackpackFilters();
    renderBackpackGrid();
  } catch (error) {
    backpackItems = [];
    setBackpackStatus('error', `${backpackText('背包載入失敗：','Backpack failed to load: ')}${error.message}`);
    renderBackpackFilters();
    renderBackpackGrid();
  }
}
window.addEventListener('popstate', () => {
  const requested = new URLSearchParams(location.search).get('category') || 'all';
  activeBackpackCategory = BACKPACK_CATEGORIES.some(category => category.key === requested) ? requested : 'all';
  renderBackpackFilters();
  renderBackpackGrid();
});
window.onLangChange = () => { if (typeof I18n !== 'undefined') I18n.apply(); renderBackpackFilters(); renderBackpackGrid(); };
initE10BackpackShell();
if (typeof I18n !== 'undefined') I18n.apply();
loadBackpack();
</script>
<script>
if (!window.__GO_E10_BACKPACK_MODE__) {
  ['/mobile-nav.js?v=20260603mn', '/site-nav.js?v=20260625presence1'].forEach((src) => {
    const script = document.createElement('script');
    script.src = src;
    script.async = false;
    document.body.appendChild(script);
  });
}
</script>
<script src="/sound.js?v=2"></script>
</body>
