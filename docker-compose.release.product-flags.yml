# Tracked release-owned product-flag authority (EQ-F R3).
#
# This file exists solely to make the two Shop/Equipment product feature
# flags an explicit, versioned, mechanically-applied part of the governed
# release path, instead of an untracked host-side fact that a governed
# recreate can silently drop.
#
# Root cause this file closes (see
# docs/deployment/EQ_F_POST_MERGE_RELEASE_RUNBOOK_PREFLIGHT.md): the
# historical /opt/go-odyssey/docker-compose.shop-reopen.override.yml on the
# Production host is untracked and is not referenced by
# scripts/release/deploy-release-image.ps1's `-f` file list, so the next
# governed --force-recreate would drop CANONICAL_COIN_SHOP_PURCHASE_ENABLED
# back to its code default (false) with no error and no operator action.
#
# Contains no secrets, no payment/Turnstile/DB configuration, and no other
# feature flag. Only CANONICAL_COIN_SHOP_PURCHASE_ENABLED is a genuine
# runtime consumer requirement (app.py:_canonical_coin_shop_purchase_enabled,
# read via _env_flag_enabled -- app.py is the only real consumer;
# scheduler.py never reads either name). EQUIPMENT_CANONICAL_LOADOUT_ENABLED
# is set explicitly here too, at its required "false" value, rather than
# left to rely on the application's own default -- an explicit, deterministic
# release value is preferred over an accidental absent-variable default even
# when the two currently happen to agree.
#
# Applying EQUIPMENT_CANONICAL_LOADOUT_ENABLED to the scheduler service here
# as well is intentionally harmless parity with the historical host override
# it replaces; it is not a claim that the scheduler consumes either flag.
#
# Do not add any other key to this file. A separate, narrower, Owner-gated
# override (docker-compose.release.equipment-enable.override.yml) is the only
# approved way to change EQUIPMENT_CANONICAL_LOADOUT_ENABLED to "true", via
# scripts/release/set-equipment-enable-state.ps1 -State Enable
# -OwnerGate GO_EQUIPMENT_ENABLE -Execute.
services:
  app:
    environment:
      CANONICAL_COIN_SHOP_PURCHASE_ENABLED: "true"
      EQUIPMENT_CANONICAL_LOADOUT_ENABLED: "false"
  scheduler:
    environment:
      CANONICAL_COIN_SHOP_PURCHASE_ENABLED: "true"
      EQUIPMENT_CANONICAL_LOADOUT_ENABLED: "false"
