<!--
  Component: Adventure World Stage (CRITICAL slot — see js/e9/shell.js)
  Stable root id: adventure-stage  (Rule #6)
  Real data source: GET /api/adventure/bootstrap (same endpoint the legacy
  Adventure Map uses) -- response.zones[] with {key,label,name,name_en,icon,
  status,can_enter,completed,stars,boss:{available,name,name_en}}. No new API.
  Progression summaries reuse the EXISTING index.adv.* i18n keys; compact
  presentation labels live in the shared i18n.js registry, never a
  component-local dictionary. Zone display names
  pick zone.nameEn under English locale (falling back to zone.name, the
  Chinese source string, if missing), via world_stage.js's zoneDisplayName()
  -- the same precedence the legacy Adventure Map's own _zoneName() uses,
  not a second naming scheme.
  No Avatar, Monster, Boss art, or Fog of War -- placeholder tiles only,
  per E9.1A2 scope.
-->
<main id="adventure-stage" class="e9-stage" data-e9-component="world_stage" data-i18n-aria-label="e9.world_stage.aria_label">
  <!-- Base L0-L3 is the governed, static V1 asset. L4 route and L5 nodes
       remain independent DOM/SVG overlays in this map-stage-local frame. -->
  <section class="e9-map-stage" id="e9-map-stage" data-i18n-aria-label="e10.world_stage.map_aria_label" hidden>
    <img class="e9-map-stage__base" data-vs1d-src="/assets/maps/e10_world_stage_v1_base.webp" alt="" width="1672" height="941">
    <svg class="e9-map-stage__route" viewBox="0 0 900 506" aria-hidden="true" focusable="false">
      <path class="e9-route__ground-shadow" d="M234 352 C280 315 296 276 327 246 C315 212 297 181 298 149 C337 137 375 129 414 133 C451 145 482 158 518 165 C560 164 608 156 643 159 C674 180 698 204 720 226 C692 258 654 294 633 329 C592 350 548 367 504 376"/>
      <path class="e9-route__ground" d="M234 352 C280 315 296 276 327 246 C315 212 297 181 298 149 C337 137 375 129 414 133 C451 145 482 158 518 165 C560 164 608 156 643 159 C674 180 698 204 720 226 C692 258 654 294 633 329 C592 350 548 367 504 376"/>
      <!-- The cyan causeway crosses the ground route at a different visual grade;
           it has no node, branch, hit target, or pointer interaction. -->
      <path class="e9-route__ascension-shadow" d="M504 376 C560 310 685 135 763 117"/>
      <path class="e9-route__ascension" d="M504 376 C560 310 685 135 763 117"/>
    </svg>
    <div class="e9-map-stage__boss-anchors" id="e9-world-stage-boss-anchors" aria-hidden="true"></div>
    <div class="e9-map-stage__nodes" id="e9-world-stage-zones" data-i18n-aria-label="e10.world_stage.zones_aria_label"></div>
    <div class="e9-map-stage__player" id="e9-world-stage-player" aria-hidden="true" hidden></div>
    <div class="e9-stage__status" id="e9-world-stage-status" data-i18n="e9.world_stage.loading" aria-live="polite">Loading adventure map…</div>
    <button class="e10-map-primary-cta e9-adventure-cta" id="e9-world-stage-primary-cta" type="button" hidden></button>
  </section>
  <section class="e9-zone-details" id="e9-world-stage-details" tabindex="-1" aria-live="polite" hidden>
    <p class="e9-zone-details__kicker" data-i18n="e10.world_stage.selected_quest">Selected quest</p>
    <button type="button" class="e9-zone-details__story-replay" id="e9-world-stage-details-replay" data-i18n="e10.world_stage.replay_story" hidden></button>
    <img class="e9-zone-details__landmark" id="e9-world-stage-details-landmark" alt="" width="320" height="320" aria-hidden="true" hidden>
    <div class="e9-zone-details__identity">
      <span id="e9-world-stage-details-number"></span>
      <span id="e9-world-stage-details-stars"></span>
    </div>
    <p class="e9-zone-details__label" id="e9-world-stage-details-label"></p>
    <p class="e9-zone-details__state" id="e9-world-stage-details-state"></p>
    <p class="e9-zone-details__summary" id="e9-world-stage-details-summary"></p>
    <div class="e9-zone-details__progress">
      <p><span data-i18n="e10.world_stage.task_progress">Task progress</span><strong id="e9-world-stage-details-progress"></strong></p>
      <p><span data-i18n="e10.world_stage.region_progress">Region progress</span><strong id="e9-world-stage-details-region-progress"></strong></p>
      <p><span data-i18n="e9.right_cards.boss_progress_title">Boss Progress</span><strong id="e9-world-stage-details-boss-progress"></strong></p>
    </div>
    <button class="e9-zone-details__cta e9-adventure-cta" id="e9-world-stage-details-cta" type="button" hidden></button>
  </section>
  <section class="e9-newbie-mainline" id="e9-newbie-mainline" tabindex="-1" aria-live="polite" hidden>
    <p class="e9-newbie-mainline__kicker" id="e9-newbie-mainline-kicker"></p>
    <h2 class="e9-newbie-mainline__title" id="e9-newbie-mainline-title"></h2>
    <p class="e9-newbie-mainline__summary" id="e9-newbie-mainline-summary"></p>
    <ol class="e9-newbie-mainline__steps" id="e9-newbie-mainline-steps"></ol>
    <p class="e9-newbie-mainline__boss" id="e9-newbie-mainline-boss"></p>
    <p class="e9-newbie-mainline__goal" id="e9-newbie-mainline-goal"></p>
    <button class="e9-newbie-mainline__cta e9-adventure-cta" id="e9-newbie-mainline-cta" type="button"></button>
  </section>
  <p class="e9-stage__note" data-i18n="e9.world_stage.note">Tap a zone to continue your adventure</p>
</main>
