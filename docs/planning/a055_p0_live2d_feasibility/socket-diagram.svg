<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Right hand weapon socket and grip axis diagram</title>
  <desc id="desc">Design-only diagram showing a sword handle entering the palm, fingers wrapping around it, thumb opposition, and the semantic socket and grip axis.</desc>
