    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd9bd"/><stop offset="1" stop-color="#ee9e7b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24364f" flood-opacity=".18"/></filter>
  </defs>
