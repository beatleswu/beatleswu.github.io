<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wave 2 P3 Wearable Runtime Review</title>
  <script src="/js/rpg_wave2_wearable_renderer.js?v=20260820p3"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color:#203047; background:#eef3f7; }
    body { margin:0; padding:24px; }
    main { max-width:1280px; margin:auto; }
    h1 { margin:0 0 6px; font-size:clamp(22px,4vw,34px); }
    p { color:#617087; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
    button { min-height:42px; padding:8px 14px; border:1px solid #cad5e1; border-radius:10px; background:#fff; color:#203047; font-weight:700; cursor:pointer; }
    button[aria-pressed="true"] { background:#0d9488; border-color:#0d9488; color:#fff; }
    .grid { display:grid; grid-template-columns:repeat(6,minmax(130px,1fr)); gap:14px; }
    .card { min-width:0; padding:10px; border:1px solid #cad5e1; border-radius:14px; background:#fff; text-align:center; }
    .card h2 { margin:0 0 8px; font-size:13px; }
    .fixture-stage { position:relative; width:100%; aspect-ratio:1056/1408; overflow:hidden; border-radius:10px; background:#f8fbfd; }
    .fixture-stage .rpg-wearable-stage { display:block; }
    .status { margin-top:8px; min-height:18px; color:#17635e; font:700 11px/1.3 ui-monospace,monospace; }
    .authority { padding:12px 14px; border-left:4px solid #0d9488; background:#fff; border-radius:8px; font-size:13px; }
    @media (max-width:760px) { body { padding:12px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } }
    @media (max-width:430px) { .grid { grid-template-columns:1fr 1fr; } .card { padding:7px; } .card h2 { font-size:11px; } }
  </style>
</head>
<body>
  <main>
    <h1>Wave 2 Gate 2 P3 · Wearable Runtime Review</h1>
    <p>Review fixture only. It exercises the same registry and renderer used by Hero/Profile/Backpack.</p>
    <div class="authority">Presentation only · ownership: <b>player_inventory</b> · equipped: <b>player_inventory.equipped</b> · effects: <b>server EQUIPMENT_DEFS</b> · client combat authority: <b>NO</b></div>
    <div class="toolbar" id="loadout-controls" aria-label="Wearable loadout"></div>
    <div class="grid" id="character-grid"></div>
  </main>
  <script>
    const CHARACTERS = ['apprentice','mage','paladin','trail_apprentice','night_runner','constellation_apprentice'];
    const LOADOUTS = {
      none: [],
      weapon: [{ equipment_id:'iron_sword', equipped:true }],
      cloth_robe: [{ equipment_id:'cloth_robe', equipped:true }],
      fox_pelt: [{ equipment_id:'fox_pelt', equipped:true }],
      armor: [{ equipment_id:'dragon_scale', equipped:true }],
      void_mantle: [{ equipment_id:'void_mantle', equipped:true }],
      accessory: [{ equipment_id:'fox_mask', equipped:true }],
      full: [
        { equipment_id:'iron_sword', equipped:true },
        { equipment_id:'dragon_scale', equipped:true },
        { equipment_id:'fox_mask', equipped:true },
      ],
    };
    let activeLoadout = 'full';
    const labels = { none:'No Weapon / Base', weapon:'Waist Sword', cloth_robe:'Cloth Robe', fox_pelt:'Fox Pelt', armor:'Dragon Scale', void_mantle:'Void Mantle', accessory:'Fox Mask', full:'Full Loadout' };
    const controlRoot = document.getElementById('loadout-controls');
    const grid = document.getElementById('character-grid');
    Object.keys(LOADOUTS).forEach(key => {
      const button = document.createElement('button');
      button.type = 'button'; button.dataset.loadout = key; button.textContent = labels[key];
      button.addEventListener('click', () => { activeLoadout = key; renderAll(); });
      controlRoot.appendChild(button);
    });
    CHARACTERS.forEach(character => {
      const card = document.createElement('article');
      card.className = 'card'; card.dataset.character = character;
      card.innerHTML = `<h2>${character.replaceAll('_',' ')}</h2><div class="fixture-stage rpg-wearable-host"><div class="rpg-wearable-stage" data-stage hidden></div></div><div class="status" data-status>loading</div>`;
      grid.appendChild(card);
    });
    function renderAll() {
      document.querySelectorAll('[data-loadout]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.loadout === activeLoadout)));
      document.querySelectorAll('.card[data-character]').forEach(card => {
        const character = card.dataset.character;
        const stage = card.querySelector('[data-stage]');
        GoOdysseyWearableRenderer.renderSafe(stage, character, LOADOUTS[activeLoadout]).then(result => {
          card.querySelector('[data-status]').textContent = result.supported ? `PASS · ${activeLoadout}` : `SAFE FALLBACK · ${result.reason}`;
        });
      });
    }
    renderAll();
  </script>
</body>
</html>
