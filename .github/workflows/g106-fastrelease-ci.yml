# G106 release candidate non-deploying, read-only CI.
name: G106 Product fast-release candidate verification
on:
  push:
    branches:
      - candidate/g106-fastrelease-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-and-gameplay-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm immutable 111-file runtime provenance against Git objects
        shell: pwsh
        run: python scripts/g106_ci_provenance_gate.py
      - name: Install exact runtime and pytest dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "pytest==8.3.5"
      - name: Run synthetic release and gameplay tests
        shell: pwsh
        env:
          PRODUCTION: "false"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SECRET_KEY: "g106-github-ci-synthetic-only"
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp="$env:RUNNER_TEMP/g106-test-temp" --junitxml="$env:RUNNER_TEMP/g106-ci-junit.xml" tests/deployment/test_build_manifest.py tests/deployment/test_build_script_safety.py tests/test_b034_equipment_loadout_service.py tests/test_c048_shop_default_purchase_authority.py tests/test_b051_lord_trial_answer_service.py tests/test_adventure_first_clear_reward.py tests/test_rewards_sync_atomic_idempotency.py
      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g106-fastrelease-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g106-ci-junit.xml
          if-no-files-found: warn
          retention-days: 14
