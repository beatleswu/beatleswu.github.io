name: G027-vNext Protected Source Admission
# Reusable trusted base only: NEVER execute candidate PR scripts.
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  g027-vnext-trusted-source:
    name: g027-vnext-trusted-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout protected base verifier without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted Git data ONLY
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Compare exact Owner-approved Product and protected source
        shell: bash
        env:
          G027_EVENT_REPO: ${{ github.repository }}
          G027_EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          G027_EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          G027_EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          G027_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          G027_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          G027_WORKFLOW_SHA: ${{ github.workflow_sha }}
          G027_WORKFLOW_REF: ${{ github.workflow_ref }}
          # Admin-controlled repository Actions variable. NEVER from a PR file.
          G027_OWNER_APPROVAL_B64: ${{ vars.G027_OWNER_APPROVED_RELEASE_V1_B64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "beatleswu/beatleswu.github.io"
          test -n "$G027_OWNER_APPROVAL_B64" || { echo "OWNER_APPROVAL_NOT_CONFIGURED" >&2; exit 1; }
          python3 trusted/scripts/release/g027_reusable_trusted_source_gate.py \
            --trusted trusted --candidate candidate
          echo "G027_PROTECTED_BASE_CI_ADMISSION=PASS"
