# G027: actual GitHub Actions source validation (no external signer or deployment).
name: G027 Source Snapshot Integrity
on:
  push:
    branches:
      - g027-owner-approved-product-intake-20261022
      - g028-owner-approved-production-baseline-20261022
      - g030-3d-public-assets-20261022
      - g036-coordinator-owner-simplified-gate-20261022
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  g009-source-snapshot:
    name: g009-source-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact change without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source commit and no unreviewed Product drift
        shell: bash
        env:
          PINNED_PRODUCT_SHA: "477598897c8d36ecf14ce4b79f16862e01cb7c4a"
          G028_PAIR_SHA: "5465b3d9f109d22e31ef1f7dfd971cb91dae6422cd687f6f0a1def2bfaa876d4"
          G028_ADOPTED_MASTER_SHA: "283dc22b8e1685732443d781074b6f4216ca3dea"
          G030_APPROVED_MASTER_SHA: "2ae01985ab716eb0175b292888ffdea570c80ca6"
          G062_APPROVED_PRODUCT_SHA: "fb07cea2d9fe20ebfc46b1093a9f86ecf680c985"
          G062_APPROVED_APP_COMMIT: "ecd3744b8b242d9a3dc0d0a6c1f46da0841079ca"
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "beatleswu/beatleswu.github.io"
          test -z "$(git status --porcelain)"
          git cat-file -e "$PINNED_PRODUCT_SHA^{commit}"
          git merge-base --is-ancestor "$PINNED_PRODUCT_SHA" HEAD
          git cat-file -e "$G028_ADOPTED_MASTER_SHA^{commit}"
          git merge-base --is-ancestor "$G028_ADOPTED_MASTER_SHA" HEAD
          git cat-file -e "$G030_APPROVED_MASTER_SHA^{commit}"
          git merge-base --is-ancestor "$G030_APPROVED_MASTER_SHA" HEAD
          git cat-file -e "$G062_APPROVED_PRODUCT_SHA^{commit}"
          git merge-base --is-ancestor "$G062_APPROVED_PRODUCT_SHA" HEAD
          # G062 was approved at exact Product SHA. This follow-up is only a CI policy admission patch.
          # Reject any new Product changes not independently approved after fb07cea2.
          git diff --name-only "$G062_APPROVED_PRODUCT_SHA" HEAD > /tmp/g062-post-approved.txt
          test "$(cat /tmp/g062-post-approved.txt)" = ".github/workflows/g009-source-snapshot.yml"
          git cat-file -e "$G062_APPROVED_APP_COMMIT^{commit}"
          # Actions checkout uses detached HEAD for PRs. The provenance test
          # needs the explicit, exact candidate-local source ref before merge.
          git update-ref refs/heads/g062-static-rollback-fix-20261022 "$G062_APPROVED_PRODUCT_SHA"
          test "$(git rev-parse refs/heads/g062-static-rollback-fix-20261022)" = "$G062_APPROVED_PRODUCT_SHA"
          git diff --name-only "$G030_APPROVED_MASTER_SHA" HEAD > /tmp/g036-changed.txt
          printf '%s\n' \
            '.github/workflows/g009-source-snapshot.yml' \
            'scripts/release/deploy-coordinated-release.ps1' \
            'tests/deployment/test_g036_coordinator_simplified_policy.py' \
            'scripts/release/ReleaseTooling.psm1' \
            'scripts/release/verify_release_candidate_binding.py' \
            'docs/deployment/G036_owner_simplified_coordinator_gate_20261022.md' \
            'scripts/release/build-release-image.ps1' \
            'scripts/release/evaluate_build_app_test_baseline.py' \
            'scripts/release/zone4_owner_b_policy.py' \
            'tests/deployment/test_g038_owner_simplified_pinned_zone4.py' \
            'docs/deployment/G038_owner_simplified_pinned_zone4_release_contract_20261022.md' \
            'scripts/release/e10_development_workflow_v2.py' \
            'tests/deployment/test_release_source_separation.py' \
            'tests/deployment/test_deploy_coordinated_release_real_wiring.py' \
            'tests/deployment/test_g041_junit_identity_policy.py' \
            'docs/deployment/G041_strict_junit_identity_and_two_rollback_pairs_20261022.md' \
            'deploy/runtime-source-provenance.json' \
            'deploy/live-static-asset-inventory.json' \
            'deploy/g043-bonus-companion-supplemental-static-pack-manifest.json' \
            'tests/deployment/test_g009_dual_delivery_closure.py' \
            'tests/deployment/test_image_content_boundary.py' \
            'tests/deployment/test_g043_bonus_supplemental_static_pack.py' \
            'docs/deployment/G043_owner_approved_supplemental_bunny_corgi_static_20261022.md' \
            'tests/deployment/test_g046_owner_cli_array_handoff.py' \
            'docs/deployment/G046_owner_cli_atomic_array_fix_20261022.md' \
            'app.py' \
            'scripts/release/CoordinatedReleaseStateMachine.psm1' \
            'tests/deployment/test_g062_public_leaderboard_assets.py' \
            'tests/deployment/test_g062_rollback_diagnostics.py' > /tmp/g036-expected.txt
          diff -u <(sort /tmp/g036-expected.txt) <(sort /tmp/g036-changed.txt)
          test "$(sha256sum deploy/known-production-rollback-pairs.json | cut -d' ' -f1)" = "$G028_PAIR_SHA"
          test -z "$(git diff --name-only "$G030_APPROVED_MASTER_SHA" HEAD -- assets/3d_shop/)"
          git diff --check "$G030_APPROVED_MASTER_SHA" HEAD
          # Preserve the sole historical pair byte-for-byte as a parsed value;
          # only one exact new Oracle observed baseline record is admitted.
          python - <<'PY'
          import json, subprocess
          orig=json.loads(subprocess.check_output(
            ['git','show','477598897c8d36ecf14ce4b79f16862e01cb7c4a:deploy/known-production-rollback-pairs.json']))
          now=json.load(open('deploy/known-production-rollback-pairs.json',encoding='utf8'))
          assert now['schema']==orig['schema']
          assert now['provenance_policy']==orig['provenance_policy']
          assert len(now['pairs'])==len(orig['pairs'])+1
          assert now['pairs'][:-1]==orig['pairs']
          p=now['pairs'][-1]
          assert p['pair_id']=='production-69dbe57a-runtime-e53a4775-static-verified-20261022'
          assert p['runtime_source_sha']=='69dbe57aa535112b1759e3f3bdcf9ecbe1680efb'
          assert p['static_source_sha']=='e53a477524af60b6b3a87dfe30b983089c137d80'
          assert p['schema_migration_required'] is False
          assert p['runtime_image_id']==p['scheduler_image_id']
          assert len(p['evidence']['compatibility_basis'])>=4
          PY
          # Exact, source-verifiable G019/G030 provenance correction only.
          python - <<'PY'
          import hashlib,json,subprocess,pathlib
          records=json.loads(pathlib.Path('deploy/runtime-source-provenance.json').read_text(encoding='utf8'))
          known={'app.py':'ecd3744b8b242d9a3dc0d0a6c1f46da0841079ca',
                 'shop.html':'15cbcdbe9c28b8f16107387e45cddb7c087f9627',
                 'inventory.html':'15cbcdbe9c28b8f16107387e45cddb7c087f9627',
                 'hero.html':'c52fb0efd2b8e5562be2aaac09c5c1eb1d86ac1a'}
          for path,commit in known.items():
            entries=[e for e in records['files'] if e['path']==path]
            assert len(entries)==1
            row=entries[0]
            data=pathlib.Path(path).read_bytes()
            blob=subprocess.check_output(['git','show',commit+':'+path])
            assert blob==data
            assert row['source_commit']==commit
            assert row['source_branch_or_local_ref']==('g062-static-rollback-fix-20261022' if path=='app.py' else 'origin/master')
            assert row['content_sha256']==hashlib.sha256(data).hexdigest()
            assert row['content_size_bytes']==len(data)
            assert row['source_commit_subject']==subprocess.check_output(
              ['git','show','-s','--format=%s',commit],text=True).strip()
            assert row['source_date']==subprocess.check_output(
              ['git','show','-s','--format=%cs',commit],text=True).strip()
          PY
          test "$(git hash-object app.py)" = "$(git rev-parse "$G062_APPROVED_APP_COMMIT:app.py")"
          for path in shop.html inventory.html Dockerfile \
                      migrations/quest_claim_v1.py \
                      index.html sw.js; do
            test -f "$path"
            test "$(git hash-object "$path")" = "$(git rev-parse "$PINNED_PRODUCT_SHA:$path")"
          done
          # Independently enforce exactly one Owner-G043 supplemental subtree,
          # preserving the entire prior Static inventory and original 69 assets.
          python - <<'PY'
          import json,hashlib,pathlib,subprocess,copy
          root=pathlib.Path('.')
          original=json.loads(subprocess.check_output([
            'git','show','dcf56dcc58e3a2bd15565998bb31c622f66b6eeb:deploy/live-static-asset-inventory.json']))
          current=json.loads((root/'deploy/live-static-asset-inventory.json').read_text(encoding='utf8'))
          prior=copy.deepcopy(current)
          entries=prior['required_subtrees']['entries']
          exact='deploy/g043-bonus-companion-supplemental-static-pack-manifest.json'
          bonus=[x for x in entries if x['manifest']==exact]
          assert len(bonus)==1
          assert bonus[0]['prefix']=='assets/3d_shop/p048/companion/'
          entries.remove(bonus[0])
          assert prior==original
          m=json.loads((root/exact).read_text(encoding='utf8'))
          old=json.loads((root/'docs/handoffs/G010_P048_C01_C04_IMAGE_CLOSURE_20261021.json').read_text(encoding='utf8'))
          assert old['release_admission'] is False
          assert old['ownership_authority_changes'] is False
          assert m['release_admission'] is True
          assert m['canonical_formal_69_glb_unchanged'] is True
          assert m['new_pet_entitlement'] is False
          assert len(m['files'])==3
          assert m['source_evidence_sha256']==hashlib.sha256(
            (root/'docs/handoffs/G010_P048_C01_C04_IMAGE_CLOSURE_20261021.json').read_bytes()).hexdigest()
          evidence={e['path']:e for e in old['files']}
          assert set(x['path'] for x in m['files'])==set(evidence)
          for x in m['files']:
            e=evidence[x['path']]
            data=(root/x['path']).read_bytes()
            assert len(data)==x['size']==e['bytes']
            assert hashlib.sha256(data).hexdigest()==x['sha256']==e['sha256']
          assert sum(x['path'].endswith('.glb') for x in m['files'])==2
          PY
          test ! -e secret_key.txt
          test ! -e .env
          echo "G043 Owner-approved exact 3-file supplemental static closure; prior formal69 model bytes and runtime App unchanged"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run real unchanged G025 and G026 regressions
        shell: bash
        run: |
          set -euo pipefail
          # Real rollback tests call powershell. Ubuntu runners typically ship
          # PowerShell Core as pwsh; expose that actual executable by the
          # expected name for this job. Fail closed if neither exists.
          if ! command -v powershell >/dev/null 2>&1; then
            command -v pwsh >/dev/null 2>&1 || { echo "PowerShell Core required for G062 tests" >&2; exit 1; }
            mkdir -p "$RUNNER_TEMP/g073-powershell-bin"
            ln -s "$(command -v pwsh)" "$RUNNER_TEMP/g073-powershell-bin/powershell"
            export PATH="$RUNNER_TEMP/g073-powershell-bin:$PATH"
          fi
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          python -m pip install --disable-pip-version-check -r requirements.txt 'pytest==8.3.5'
          python -m pytest -q -p no:cacheprovider \
            tests/test_g026_daily_gcs_backup_offline_preflight.py \
            tests/test_g025_backup_audit_evidence_contract.py \
            tests/test_g025_backup_iam_403_readonly_gate.py \
            tests/test_g030_public_69_3d_assets_activation.py \
            tests/test_g010_3d_gallery_activation_contract.py \
            tests/deployment/test_g009_formal9_replacement_packaging.py \
            tests/test_g022_release_admission_and_image_rollback_contract.py \
            tests/test_g024_arm64_quest_d015_migration_prod_backup_gate.py \
            tests/deployment/test_g036_coordinator_simplified_policy.py \
            tests/deployment/test_g038_owner_simplified_pinned_zone4.py \
            tests/deployment/test_g041_junit_identity_policy.py \
            tests/deployment/test_g046_owner_cli_array_handoff.py \
            tests/deployment/test_g062_public_leaderboard_assets.py \
            tests/deployment/test_g062_rollback_diagnostics.py \
            tests/deployment/test_g009_zone4_owner_b_contract_conflict_policy.py \
            tests/deployment/test_build_app_known_failure_baseline.py \
            tests/deployment/test_release_source_separation.py::test_control_plane_authority_declarations_agree \
            tests/deployment/test_e10_development_workflow_v2.py \
            tests/deployment/test_runtime_dependency_provenance.py \
            tests/deployment/test_g043_bonus_supplemental_static_pack.py \
            tests/deployment/test_g009_dual_delivery_closure.py \
            tests/deployment/test_image_content_boundary.py
