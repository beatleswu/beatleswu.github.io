# G027: actual GitHub Actions source validation (no external signer or deployment).
name: G027 Source Snapshot Integrity
on:
  push:
    branches:
      - g027-owner-approved-product-intake-20261022
      - g028-owner-approved-production-baseline-20261022
      - g030-3d-public-assets-20261022
      - g036-coordinator-owner-simplified-gate-20261022
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  g009-source-snapshot:
    name: g009-source-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact change without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source commit and no unreviewed Product drift
        shell: bash
        env:
          PINNED_PRODUCT_SHA: "477598897c8d36ecf14ce4b79f16862e01cb7c4a"
          G028_PAIR_SHA: "5465b3d9f109d22e31ef1f7dfd971cb91dae6422cd687f6f0a1def2bfaa876d4"
          G028_ADOPTED_MASTER_SHA: "283dc22b8e1685732443d781074b6f4216ca3dea"
          G030_APPROVED_MASTER_SHA: "2ae01985ab716eb0175b292888ffdea570c80ca6"
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "beatleswu/beatleswu.github.io"
          test -z "$(git status --porcelain)"
          git cat-file -e "$PINNED_PRODUCT_SHA^{commit}"
          git merge-base --is-ancestor "$PINNED_PRODUCT_SHA" HEAD
          git cat-file -e "$G028_ADOPTED_MASTER_SHA^{commit}"
          git merge-base --is-ancestor "$G028_ADOPTED_MASTER_SHA" HEAD
          git cat-file -e "$G030_APPROVED_MASTER_SHA^{commit}"
          git merge-base --is-ancestor "$G030_APPROVED_MASTER_SHA" HEAD
          git diff --name-only "$G030_APPROVED_MASTER_SHA" HEAD > /tmp/g036-changed.txt
          printf '%s\n' \
            '.github/workflows/g009-source-snapshot.yml' \
            'scripts/release/deploy-coordinated-release.ps1' \
            'tests/deployment/test_g036_coordinator_simplified_policy.py' \
            'scripts/release/ReleaseTooling.psm1' \
            'scripts/release/verify_release_candidate_binding.py' \
            'docs/deployment/G036_owner_simplified_coordinator_gate_20261022.md' \
            'scripts/release/build-release-image.ps1' \
            'scripts/release/evaluate_build_app_test_baseline.py' \
            'scripts/release/zone4_owner_b_policy.py' \
            'tests/deployment/test_g038_owner_simplified_pinned_zone4.py' \
            'docs/deployment/G038_owner_simplified_pinned_zone4_release_contract_20261022.md' \
            'scripts/release/e10_development_workflow_v2.py' \
            'tests/deployment/test_release_source_separation.py' > /tmp/g036-expected.txt
          diff -u <(sort /tmp/g036-expected.txt) <(sort /tmp/g036-changed.txt)
          test "$(sha256sum deploy/known-production-rollback-pairs.json | cut -d' ' -f1)" = "$G028_PAIR_SHA"
          test -z "$(git diff --name-only "$G030_APPROVED_MASTER_SHA" HEAD -- assets/3d_shop/)"
          git diff --check "$G030_APPROVED_MASTER_SHA" HEAD
          # Preserve the sole historical pair byte-for-byte as a parsed value;
          # only one exact new Oracle observed baseline record is admitted.
          python - <<'PY'
          import json, subprocess
          orig=json.loads(subprocess.check_output(
            ['git','show','477598897c8d36ecf14ce4b79f16862e01cb7c4a:deploy/known-production-rollback-pairs.json']))
          now=json.load(open('deploy/known-production-rollback-pairs.json',encoding='utf8'))
          assert now['schema']==orig['schema']
          assert now['provenance_policy']==orig['provenance_policy']
          assert len(now['pairs'])==len(orig['pairs'])+1
          assert now['pairs'][:-1]==orig['pairs']
          p=now['pairs'][-1]
          assert p['pair_id']=='production-69dbe57a-runtime-e53a4775-static-verified-20261022'
          assert p['runtime_source_sha']=='69dbe57aa535112b1759e3f3bdcf9ecbe1680efb'
          assert p['static_source_sha']=='e53a477524af60b6b3a87dfe30b983089c137d80'
          assert p['schema_migration_required'] is False
          assert p['runtime_image_id']==p['scheduler_image_id']
          assert len(p['evidence']['compatibility_basis'])>=4
          PY
          for path in app.py shop.html inventory.html Dockerfile \
                      migrations/quest_claim_v1.py \
                      deploy/live-static-asset-inventory.json index.html sw.js; do
            test -f "$path"
            test "$(git hash-object "$path")" = "$(git rev-parse "$PINNED_PRODUCT_SHA:$path")"
          done
          test ! -e secret_key.txt
          test ! -e .env
          echo "G038 exact pinned Owner-approved Frozen conflicts in existing simplified policy: Product 2ae01985 immutable"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run real unchanged G025 and G026 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python -m pytest -q -p no:cacheprovider \
            tests/test_g026_daily_gcs_backup_offline_preflight.py \
            tests/test_g025_backup_audit_evidence_contract.py \
            tests/test_g025_backup_iam_403_readonly_gate.py \
            tests/test_g030_public_69_3d_assets_activation.py \
            tests/test_g010_3d_gallery_activation_contract.py \
            tests/deployment/test_g009_formal9_replacement_packaging.py \
            tests/test_g022_release_admission_and_image_rollback_contract.py \
            tests/test_g024_arm64_quest_d015_migration_prod_backup_gate.py \
            tests/deployment/test_g036_coordinator_simplified_policy.py \
            tests/deployment/test_g038_owner_simplified_pinned_zone4.py \
            tests/deployment/test_g009_zone4_owner_b_contract_conflict_policy.py \
            tests/deployment/test_build_app_known_failure_baseline.py \
            tests/deployment/test_release_source_separation.py \
            tests/deployment/test_e10_development_workflow_v2.py
