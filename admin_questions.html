<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>題目管理中心｜弈境奇兵</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0b0f0d;
      --bg-grad:radial-gradient(circle at 10% -12%,#1f3b2c 0,transparent 38rem),linear-gradient(160deg,#0a0e0c,#0f1613 55%,#0a0d0b);
      --surface:#121815;
      --surface-2:#171f1a;
      --surface-3:#1e2921;
      --surface-raised:#1a2420;
      --border:#25322b;
      --border-strong:#354438;
      --text:#eef3ee;
      --text-muted:#9db2a4;
      --text-faint:#728073;
      --accent:#4fd39e;
      --accent-strong:#39b585;
      --accent-ink:#04140d;
      --gold:#e9c17a;
      --blue:#82bdf2;
      --amber:#f0b768;
      --purple:#bda3ec;
      --danger:#f1897d;
      --radius-lg:20px;
      --radius-md:14px;
      --radius-sm:10px;
      --shadow-card:0 1px 0 rgba(255,255,255,.02) inset,0 10px 28px rgba(0,0,0,.28);
      --shadow-pop:0 20px 55px rgba(0,0,0,.42);
      --tap:48px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-grad),var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
    body{height:100vh;height:100dvh}
    button,input,select{font:inherit;color:inherit}
    button{touch-action:manipulation;cursor:pointer;background:none;border:none}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    ::selection{background:rgba(79,211,158,.35)}

    /* ---------- app shell ---------- */
    .app-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-muted);gap:10px;flex-direction:column}
    .app-loading[hidden]{display:none}
    .app-loading .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--accent);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .app-loading.error{color:var(--danger)}

    .app-root{display:flex;flex-direction:column;height:100vh;height:100dvh}

    .topbar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));border-bottom:1px solid var(--border);background:rgba(10,15,13,.9);backdrop-filter:blur(14px);flex:0 0 auto}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{display:grid;place-items:center;flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:linear-gradient(155deg,#2c2214,#1a1509);border:1px solid #6b5527;color:var(--gold);font-size:19px;font-weight:700}
    .brand h1{margin:0;font-size:16px;font-weight:750;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand p{margin:1px 0 0;color:var(--text-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-spacer{flex:1 1 auto}
    .sync-pill{display:none;align-items:center;gap:6px;padding:0 10px;height:32px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:12px}
    @media(min-width:720px){.sync-pill{display:inline-flex}}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:16px}
    .icon-btn:hover{border-color:var(--border-strong);background:var(--surface-3)}
    .icon-btn.spinning svg,.icon-btn.spinning{animation:spin 1s linear infinite}
    .back-link{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border:1px solid var(--border);border-radius:12px;color:var(--text-muted);text-decoration:none;font-size:13px;white-space:nowrap}
    .back-link:hover{color:var(--text);border-color:var(--border-strong)}

    .workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;grid-template-areas:"rail";overflow:hidden}

    /* ---------- rail (nav + queue list) ---------- */
    .rail{grid-area:rail;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface)}
    .rail-tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
    .rail-tabs::-webkit-scrollbar{display:none}
    .tab-btn{position:relative;display:flex;align-items:center;gap:7px;flex:0 0 auto;height:var(--tap);padding:0 14px;border-radius:13px;border:1px solid transparent;color:var(--text-muted);font-weight:650;font-size:13.5px;white-space:nowrap}
    .tab-btn:hover{background:var(--surface-2);color:var(--text)}
    .tab-btn.active{background:var(--surface-3);border-color:var(--border-strong);color:var(--text)}
    .tab-btn.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
    .tab-count{min-width:20px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--text-faint);font-size:11px;text-align:center;font-weight:700}
    .tab-btn.active .tab-count{background:rgba(79,211,158,.18);color:var(--accent)}
    .tab-btn.has-items .tab-count{color:var(--gold);background:rgba(233,193,122,.14)}

    .rail-search{display:flex;align-items:center;gap:8px;padding:2px 12px 10px}
    .rail-search input{flex:1 1 auto;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
    .rail-search input::placeholder{color:var(--text-faint)}
    .rail-meta{padding:0 14px 8px;color:var(--text-faint);font-size:12px}

    .rail-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 8px 16px;display:grid;gap:7px;-webkit-overflow-scrolling:touch}
    .item-card{display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 13px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface-2);text-align:left;transition:border-color .12s,background .12s}
    .item-card:hover{border-color:var(--border-strong);background:var(--surface-3)}
    .item-card.selected{border-color:var(--accent);background:linear-gradient(160deg,rgba(79,211,158,.14),rgba(79,211,158,.05));box-shadow:0 0 0 1px rgba(79,211,158,.25) inset}
    .item-card .row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .item-card h3{margin:0;font-size:14.5px;font-weight:700;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item-card .reason-line{margin:0;color:var(--text-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .item-card .row2{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:1px}

    .badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
    .badge-source.player{background:rgba(130,189,242,.14);color:var(--blue);border-color:rgba(130,189,242,.28)}
    .badge-source.system{background:rgba(189,163,236,.14);color:var(--purple);border-color:rgba(189,163,236,.28)}
    .badge-source.manual{background:rgba(240,183,104,.14);color:var(--amber);border-color:rgba(240,183,104,.28)}
    .badge-plain{background:var(--surface-3);color:var(--text-muted);border-color:var(--border)}
    .badge-status{background:rgba(255,255,255,.04);color:var(--text-muted)}
    .badge-status.ok{background:rgba(79,211,158,.14);color:var(--accent)}
    .badge-status.warn{background:rgba(240,183,104,.14);color:var(--amber)}
    .badge-status.danger{background:rgba(241,137,125,.14);color:var(--danger)}

    .rail-empty,.stage-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:50px 22px;text-align:center;color:var(--text-faint)}
    .rail-empty h3,.stage-empty h3{margin:0;color:var(--text-muted);font-size:15px}
    .rail-empty p,.stage-empty p{margin:0;font-size:13px;max-width:30ch}

    /* ---------- stage (center workspace) ---------- */
    .stage{grid-area:stage;display:none;min-height:0;overflow-y:auto;padding:14px 20px 20px;-webkit-overflow-scrolling:touch}
    .stage-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
    .stage-header{display:flex;align-items:flex-start;gap:10px}
    .stage-back{display:none;flex:0 0 auto;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2)}
    .stage-title-wrap{flex:1 1 auto;min-width:0}
    .stage-title-wrap h2{margin:0;font-size:19px;font-weight:750;overflow-wrap:anywhere}
    .stage-title-wrap .stage-sub{margin:3px 0 0;color:var(--text-muted);font-size:13px}

    .reason-banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border)}
    .reason-banner .icon{flex:0 0 auto;font-size:18px;line-height:1}
    .reason-banner .body{min-width:0}
    .reason-banner strong{display:block;font-size:13.5px;margin-bottom:2px}
    .reason-banner span{color:var(--text-muted);font-size:12.5px}

    .board-shell{border-radius:var(--radius-lg);background:linear-gradient(165deg,var(--surface-raised),var(--surface));border:1px solid var(--border);box-shadow:var(--shadow-card);padding:12px}
    .board-wrap{position:relative;width:min(100%,560px,52vh);aspect-ratio:1;margin:0 auto;border-radius:16px;overflow:hidden;background:#d8ac60;box-shadow:inset 0 0 0 7px rgba(65,42,14,.14),0 16px 34px rgba(0,0,0,.32)}
    #question-board{display:block;width:100%;height:100%;touch-action:none}
    .board-hint{margin:10px 0 0;text-align:center;color:var(--text-muted);font-size:12.5px;min-height:18px}
    .board-hint.active{color:var(--blue);font-weight:650}
    .board-legend{display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap}
    .board-legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-faint)}
    .board-legend i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid currentColor;background:rgba(255,249,231,.15)}

    .center-status{min-height:20px;padding:0 2px;color:var(--text-muted);font-size:12.5px}
    .center-status.error{color:var(--danger);font-weight:650}

    /* action host: sgf_report_widget mounts here; give it an app-like frame */
    #question-review-controls{min-height:0}
    #question-review-controls:empty{display:none}

    .dup-actions{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border)}
    .dup-actions .title{font-weight:700;font-size:13.5px}
    .dup-btn-row{display:flex;gap:8px;flex-wrap:wrap}
    .dup-btn{flex:1 1 140px;min-height:var(--tap);border-radius:12px;border:1px solid var(--border-strong);background:var(--surface-3);font-weight:700;font-size:13.5px}
    .dup-btn:hover{border-color:var(--accent)}
    .dup-btn.confirm{background:rgba(240,183,104,.14);border-color:rgba(240,183,104,.4);color:var(--amber)}
    .dup-btn.reject{background:rgba(79,211,158,.1);border-color:rgba(79,211,158,.35);color:var(--accent)}
    .dup-btn.pick{background:var(--surface-3)}
    .dup-status{min-height:18px;font-size:12.5px;color:var(--text-muted)}
    .dup-status.error{color:var(--danger)}

    .empty-can{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px;text-align:center;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md)}

    /* ---------- info panel (right) ---------- */
    .info-panel{grid-area:info;display:none;flex-direction:column;min-height:0;overflow-y:auto;padding:16px 16px 24px;border-left:1px solid var(--border);background:var(--surface);gap:12px}
    .info-hint{color:var(--text-faint);font-size:13px;padding:24px 4px;text-align:center}
    .info-card{padding:13px 14px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border)}
    .info-card h4{margin:0 0 9px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);font-weight:750}
    .field-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
    .field-row:last-child{border-bottom:none}
    .field-row .k{color:var(--text-faint);flex:0 0 auto}
    .field-row .v{color:var(--text);text-align:right;font-weight:600;overflow-wrap:anywhere}
    .history-mini{display:flex;flex-direction:column;gap:6px}
    .history-mini .entry{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-muted)}
    .history-mini .entry b{color:var(--text);font-weight:650}
    .history-more{margin-top:10px;width:100%;height:40px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface-3);font-weight:700;font-size:12.5px}
    .history-more:hover{border-color:var(--accent)}
    .advanced-link{display:block;margin-top:4px;color:var(--blue);font-size:12.5px;text-decoration:none}
    .advanced-link:hover{text-decoration:underline}

    /* ---------- history drawer ---------- */
    .drawer{position:fixed;inset:0;z-index:80}
    .drawer-backdrop{position:absolute;inset:0;background:rgba(4,7,5,.6);backdrop-filter:blur(2px)}
    .drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
    .drawer-head h3{margin:0;font-size:16px}
    .drawer-body{flex:1 1 auto;overflow-y:auto;padding:12px 16px 24px}
    .version-row{padding:11px 0;border-bottom:1px solid var(--border)}
    .version-row:last-child{border-bottom:none}
    .version-row .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
    .version-row .meta{margin-top:3px;color:var(--text-muted);font-size:12px}
    .version-row .revert-tag{color:var(--danger)}

    /* ---------- toolbar action for browse/search-only sections ---------- */
    .toolbar-inline{display:flex;align-items:center;justify-content:space-between;padding:0 2px}

    /* ================= LANDSCAPE / WIDE (iPad landscape+) ================= */
    @media(min-width:1024px){
      .workspace{grid-template-columns:296px minmax(420px,1fr) 320px;grid-template-areas:"rail stage info"}
      .rail{border-right:1px solid var(--border)}
      .stage{display:block}
      .info-panel{display:flex}
      .app-root[data-selection="false"] .stage{display:flex;align-items:center;justify-content:center}
    }
    @media(min-width:1280px){
      .workspace{grid-template-columns:320px minmax(480px,1fr) 340px}
      .stage-inner{max-width:820px}
      .board-wrap{width:min(100%,620px)}
    }

    /* ================= NARROW (iPad portrait & phones): one region at a time ================= */
    @media(max-width:1023px){
      .rail{display:flex}
      .stage{display:none;padding:14px 14px 24px}
      .info-panel{display:none;border-left:none;border-top:1px solid var(--border)}
      .app-root[data-selection="true"] .rail{display:none}
      .app-root[data-selection="true"] .stage{display:block}
      .app-root[data-selection="true"] .info-panel{display:flex}
      .app-root[data-selection="true"] .workspace{grid-template-columns:1fr;grid-template-areas:"stage" "info";overflow-y:auto}
      .stage-back{display:inline-flex}
      .info-panel{max-height:none}
      .board-wrap{width:min(100%,480px)}
    }
    @media(max-width:640px){
      .brand p{display:none}
      .topbar{padding:8px 12px}
      .tab-btn{padding:0 11px;font-size:13px}
      .stage{padding:12px 10px 20px}
      .stage-title-wrap h2{font-size:17px}
      .dup-btn-row{flex-direction:column}
    }
  </style>
</head>
<body data-sgf-report-surface="admin_questions">
  <div id="app-loading" class="app-loading"><div class="spinner" aria-hidden="true"></div><p>正在載入題目管理中心…</p></div>
  <div id="app-root" class="app-root" hidden data-selection="false">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">題</div><div><h1>題目管理中心</h1><p>看棋盤、看原因、選處理方式，儲存並下一題。</p></div></div>
      <div class="topbar-spacer"></div>
      <span id="sync-status" class="sync-pill">已就緒</span>
      <button id="refresh-btn" class="icon-btn" type="button" title="重新整理" aria-label="重新整理">↻</button>
      <a class="back-link" href="/admin">← 管理後台</a>
    </header>
    <div class="workspace">
      <nav class="rail" aria-label="題目管理分區">
        <div class="rail-tabs" id="rail-tabs" role="tablist"></div>
        <div class="rail-search">
          <input id="center-search" type="search" placeholder="搜尋題目、主題或回報原因" aria-label="搜尋題目">
        </div>
        <div class="rail-meta" id="rail-meta"></div>
        <div class="rail-list" id="center-list"></div>
      </nav>
      <main class="stage" id="stage"></main>
      <aside class="info-panel" id="info-panel"></aside>
    </div>
  </div>

  <div class="drawer" id="history-drawer" hidden>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="修改歷史">
      <div class="drawer-head"><h3>修改歷史</h3><button class="icon-btn" id="drawer-close" aria-label="關閉">✕</button></div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>

  <script src="/sgf_report_widget.js?v=a033r1" defer></script>
  <script src="/admin/questions.js" defer></script>
</body>
</html>
